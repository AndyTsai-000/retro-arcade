<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打地鼠</title>
<style>
  html,body{margin:0;height:100%;background:#0c0a1e;color:#e8e4ff;font-family:"Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none}
  body{display:flex;flex-direction:column;align-items:center}
  #hud{display:flex;gap:18px;align-items:center;padding:8px 12px;font-size:14px;white-space:nowrap}
  #hud b{color:#ffd84a;font-size:20px;font-variant-numeric:tabular-nums;margin-left:4px}
  canvas{display:block;border-radius:8px;touch-action:none;cursor:none}
  #tip{font-size:12px;opacity:.6;padding:5px}
</style>
</head>
<body>
  <div id="hud"><span>分數<b id="score">0</b></span><span>最高<b id="best">0</b></span><span>連擊<b id="combo">0</b></span><span>生命<b id="lives">❤❤❤❤❤</b></span></div>
  <canvas id="cv"></canvas>
  <div id="tip">點地鼠（鍵盤 1～9 對應九個洞，跟數字鍵盤一樣排）　｜　金色地鼠分數高、別打頭上有炸彈的地鼠　｜　漏掉 5 隻就結束</div>
<script>
// 打地鼠：九個洞輪流冒出地鼠，越打越快。漏掉一隻少一顆心；打到炸彈鼠也少一顆心。
const W=480,H=520,$=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const HOLES=[]; for(let r=0;r<3;r++) for(let c=0;c<3;c++) HOLES.push({x:90+c*150,y:170+r*120,m:null});
// 鍵盤：數字鍵盤排法（7 8 9 在上排、1 2 3 在下排）
const KEYMAP={7:0,8:1,9:2,4:3,5:4,6:5,1:6,2:7,3:8};
let score,best=+localStorage.getItem('whack-best')||0,lives,combo,state,spawnT,elapsed,mx=W/2,my=H/2,hamT=0,parts=[],pops=[],t=0,shake=0;
function hud(){ $('score').textContent=score; $('best').textContent=best; $('combo').textContent=combo; $('lives').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,5-lives)); }
function reset(){ score=0; lives=5; combo=0; state='ready'; spawnT=1; elapsed=0; parts=[]; pops=[]; for(const h of HOLES) h.m=null; hud(); }
const level=()=>Math.min(1,elapsed/150); // 兩分半鐘內慢慢變快
function spawn(){ const free=HOLES.filter(h=>!h.m); if(!free.length) return; const h=free[Math.floor(Math.random()*free.length)],L=level(),r=Math.random();
  const kind=r<.08+.04*L?'gold':r<.2+.1*L&&elapsed>12?'bomb':'mole'; h.m={kind,up:0,stay:(1.5-.85*L)*(kind==='gold'?.75:1),t:0,hit:false,out:false}; }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=60+Math.random()*200; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,t:0,col,sz:3+Math.random()*4}); } }
function whack(i){ if(state==='over'){ reset(); return; } if(state==='ready') state='play'; hamT=.18; const h=HOLES[i]; if(!h) return; mx=h.x; my=h.y-30;
  const m=h.m; if(!m||m.hit||m.up<.45){ combo=0; hud(); return; } m.hit=true; m.t=0; shake=.1;
  if(m.kind==='bomb'){ lives--; combo=0; burst(h.x,h.y-30,'#ff8a3d',26); pops.push({x:h.x,y:h.y-70,s:'碰！',c:'#ff6b4a',t:0}); if(lives<=0) end(); }
  else { combo++; const p=(m.kind==='gold'?30:10)*(1+Math.floor(combo/5)); score+=p; burst(h.x,h.y-30,m.kind==='gold'?'#ffd84a':'#c8a070',14); pops.push({x:h.x,y:h.y-70,s:'+'+p+(combo>=5?'　'+combo+' 連擊':''),c:m.kind==='gold'?'#ffd84a':'#fff',t:0}); if(score>best){ best=score; localStorage.setItem('whack-best',best); } }
  hud(); }
function end(){ state='over'; for(const h of HOLES) if(h.m) h.m.hit=true; }
function update(dt){ t+=dt; if(hamT>0) hamT-=dt; if(shake>0) shake-=dt;
  for(const p of parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=600*dt; } parts=parts.filter(p=>p.t<.8); for(const p of pops) p.t+=dt; pops=pops.filter(p=>p.t<1);
  for(const h of HOLES){ const m=h.m; if(!m) continue; m.t+=dt;
    if(m.hit){ m.up=Math.max(0,m.up-dt*5); if(m.up<=0&&m.t>.25) h.m=null; continue; }
    if(m.t<m.stay){ m.up=Math.min(1,m.up+dt*6); } else { m.up-=dt*5; if(m.up<=0){ if(m.kind!=='bomb'&&state==='play'){ lives--; combo=0; pops.push({x:h.x,y:h.y-40,s:'跑掉了',c:'#ff9d9d',t:0}); hud(); if(lives<=0) end(); } h.m=null; } } }
  if(state!=='play') return; elapsed+=dt; spawnT-=dt; if(spawnT<=0){ spawn(); if(level()>.5&&Math.random()<level()*.5) spawn(); spawnT=1.1-.7*level(); } }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function drawMole(h){ const m=h.m; if(!m) return; const up=m.up,x=h.x,y=h.y; ctx.save(); ctx.beginPath(); ctx.rect(x-70,y-130,140,130); ctx.clip(); ctx.translate(x,y+70-up*92);
  const body=m.kind==='gold'?'#e8b830':'#9a6a42',belly=m.kind==='gold'?'#fff0a0':'#e8c8a0';
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(0,0,40,52,0,0,7); ctx.fill(); ctx.fillStyle=belly; ctx.beginPath(); ctx.ellipse(0,18,26,32,0,0,7); ctx.fill();
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(-26,-38,10,0,7); ctx.arc(26,-38,10,0,7); ctx.fill(); ctx.fillStyle='#e89a8a'; ctx.beginPath(); ctx.arc(-26,-38,5,0,7); ctx.arc(26,-38,5,0,7); ctx.fill();
  if(m.hit){ ctx.strokeStyle='#2a1a10'; ctx.lineWidth=3; for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*14-6,-22); ctx.lineTo(s*14+6,-12); ctx.moveTo(s*14+6,-22); ctx.lineTo(s*14-6,-12); ctx.stroke(); } for(let i=0;i<3;i++){ const a=t*6+i*2.1; ctx.fillStyle='#ffd84a'; ctx.beginPath(); ctx.arc(Math.cos(a)*30,-60+Math.sin(a)*8,4,0,7); ctx.fill(); } }
  else { ctx.fillStyle='#1a0f08'; ctx.beginPath(); ctx.arc(-14,-17,5.5,0,7); ctx.arc(14,-17,5.5,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-12,-19,2,0,7); ctx.arc(16,-19,2,0,7); ctx.fill(); }
  ctx.fillStyle='#ff8aa0'; ctx.beginPath(); ctx.ellipse(0,-4,9,6.5,0,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(-5,4,4,7); ctx.fillRect(1,4,4,7);
  ctx.strokeStyle='rgba(40,20,10,.5)'; ctx.lineWidth=1.3; for(const s of [-1,1]) for(const d of [-3,3]){ ctx.beginPath(); ctx.moveTo(s*12,-2+d); ctx.lineTo(s*30,-5+d*2); ctx.stroke(); }
  if(m.kind==='bomb'){ ctx.fillStyle='#d8302a'; ctx.beginPath(); ctx.arc(0,-34,30,Math.PI,0); ctx.fill(); ctx.fillRect(-34,-36,68,6); ctx.fillStyle='#fff'; ctx.fillRect(-4,-60,8,22); ctx.fillStyle='#2a2a30'; ctx.beginPath(); ctx.arc(0,-72,10,0,7); ctx.fill(); ctx.strokeStyle='#c8a070'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(4,-80); ctx.quadraticCurveTo(12,-90,8,-96); ctx.stroke(); ctx.fillStyle=t%0.3<.15?'#ffd84a':'#ff6b4a'; ctx.beginPath(); ctx.arc(8,-97,4,0,7); ctx.fill(); }
  if(m.kind==='gold'){ ctx.fillStyle='#fff'; for(let i=0;i<3;i++){ const a=t*3+i*2.1; ctx.globalAlpha=.6+.4*Math.sin(t*8+i); ctx.beginPath(); ctx.arc(Math.cos(a)*44,-10+Math.sin(a)*40,2.5,0,7); ctx.fill(); } ctx.globalAlpha=1; }
  ctx.restore(); }
function draw(){ const k=cv.width/W; ctx.setTransform(k,0,0,k,0,0); if(shake>0) ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
  let g=ctx.createLinearGradient(0,0,0,110); g.addColorStop(0,'#7ec8ff'); g.addColorStop(1,'#d8f0ff'); ctx.fillStyle=g; ctx.fillRect(-10,-10,W+20,120);
  ctx.fillStyle='rgba(255,255,255,.9)'; for(const [x,y,s] of [[80,40,1],[330,28,1.3],[430,70,.8]]){ ctx.beginPath(); ctx.arc(x,y,16*s,0,7); ctx.arc(x+18*s,y+4,13*s,0,7); ctx.arc(x-16*s,y+5,11*s,0,7); ctx.fill(); }
  ctx.fillStyle='#5aa848'; ctx.beginPath(); ctx.moveTo(0,110); for(let x=0;x<=W;x+=40) ctx.quadraticCurveTo(x+20,92,x+40,108); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  g=ctx.createLinearGradient(0,100,0,H); g.addColorStop(0,'#6ab850'); g.addColorStop(1,'#3a7a2a'); ctx.fillStyle=g; ctx.fillRect(0,112,W,H-112);
  ctx.strokeStyle='rgba(30,80,20,.35)'; ctx.lineWidth=1.5; for(let i=0;i<120;i++){ const x=(i*53)%W,y=120+(i*37)%(H-120); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y-7); ctx.moveTo(x+3,y); ctx.lineTo(x+5,y-6); ctx.stroke(); }
  HOLES.forEach((h,i)=>{ ctx.fillStyle='#4a3020'; ctx.beginPath(); ctx.ellipse(h.x,h.y+6,62,22,0,0,7); ctx.fill(); ctx.fillStyle='#1a0f08'; ctx.beginPath(); ctx.ellipse(h.x,h.y,52,16,0,0,7); ctx.fill();
    drawMole(h);
    ctx.fillStyle='#6a4a2a'; ctx.beginPath(); ctx.ellipse(h.x,h.y+4,58,12,0,0,Math.PI); ctx.fill(); ctx.fillStyle='#8a6038'; ctx.beginPath(); ctx.ellipse(h.x,h.y+8,62,13,0,0,Math.PI); ctx.lineTo(h.x-62,h.y+8); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='bold 13px "Microsoft JhengHei"'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Object.keys(KEYMAP).find(k=>KEYMAP[k]===i),h.x+52,h.y+22); });
  for(const p of parts){ ctx.globalAlpha=1-p.t/.8; ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.sz,p.sz); } ctx.globalAlpha=1;
  for(const p of pops){ ctx.globalAlpha=1-p.t; ctx.font='bold 22px "Microsoft JhengHei"'; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='#1a1030'; ctx.strokeText(p.s,p.x,p.y-p.t*40); ctx.fillStyle=p.c; ctx.fillText(p.s,p.x,p.y-p.t*40); } ctx.globalAlpha=1;
  // 槌子
  ctx.save(); ctx.translate(mx+30,my-10); ctx.rotate(hamT>0?-.1:-.7); ctx.fillStyle='#8a5a2a'; rrect(-4,-6,8,62,3); ctx.fill(); ctx.fillStyle='#d8302a'; rrect(-26,-24,52,26,8); ctx.fill(); ctx.fillStyle='#ff6b5a'; rrect(-26,-24,52,8,6); ctx.fill(); ctx.fillStyle='#ffd84a'; ctx.fillRect(-28,-22,4,22); ctx.fillRect(24,-22,4,22); ctx.restore();
  const T=(s,y,sz,c)=>{ ctx.font='bold '+sz+'px "Microsoft JhengHei"'; ctx.textAlign='center'; ctx.lineWidth=5; ctx.strokeStyle='#1a1030'; ctx.strokeText(s,W/2,y); ctx.fillStyle=c; ctx.fillText(s,W/2,y); };
  if(state==='ready') T('點任何一個洞（或按 1～9）開始',60,20,'#fff');
  if(state==='over'){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H); T('遊戲結束',H/2-30,40,'#ff6b6b'); T('分數 '+score,H/2+12,24,'#fff'); T('點一下或按空白鍵再玩一次',H/2+48,16,'#cfc8ff'); } }
const toXY=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; };
cv.addEventListener('pointermove',e=>{ [mx,my]=toXY(e); });
cv.addEventListener('pointerdown',e=>{ [mx,my]=toXY(e); if(state==='over'){ reset(); return; } let bi=-1,bd=1e9; HOLES.forEach((h,i)=>{ const d=Math.hypot((mx-h.x)/1,(my-(h.y-35))/1.3); if(d<bd){ bd=d; bi=i; } }); if(bd<80) whack(bi); else { hamT=.18; } });
addEventListener('keydown',e=>{ const n=e.code.replace('Numpad','').replace('Digit',''); if(KEYMAP[n]!=null){ e.preventDefault(); whack(KEYMAP[n]); } else if((e.code==='Space'||e.code==='Enter')&&state==='over'){ e.preventDefault(); reset(); } });
function fit(){ const avH=innerHeight-$('hud').offsetHeight-$('tip').offsetHeight-14,s=Math.max(200,Math.min(avH,(innerWidth-20)*H/W)),dpr=window.devicePixelRatio||1; cv.style.height=s+'px'; cv.style.width=s*W/H+'px'; cv.width=Math.round(s*W/H*dpr); cv.height=Math.round(s*dpr); }
addEventListener('resize',fit);
let last=0; function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; update(dt); draw(); requestAnimationFrame(frame); }
fit(); reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
