<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>踩地雷</title>

<style>
  html,body{margin:0;height:100%;background:#008080;font-family:"Microsoft JhengHei",sans-serif;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;gap:10px;--c:30px}
  #top{display:flex;align-items:center;gap:8px;padding-top:10px;font-size:14px;color:#fff}
  #top a{color:#fff;text-decoration:none;margin-right:10px}
  #top a:hover{text-decoration:underline}
  #top button{font:inherit;padding:3px 12px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer}
  #top button.on{border-color:#404040 #fff #fff #404040;background:#a8a8a8;font-weight:bold}
  #best{margin-left:10px;min-width:110px}
  #win{background:#c0c0c0;padding:8px;border:3px solid;border-color:#fff #808080 #808080 #fff;box-shadow:3px 3px 0 #0005}
  #bar{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;margin-bottom:8px;
    border:3px solid;border-color:#808080 #fff #fff #808080}
  .led{background:#000;color:#f00;font:bold 26px/1 Consolas,"Courier New",monospace;padding:3px 4px;letter-spacing:2px;
    border:1px solid;border-color:#808080 #fff #fff #808080}
  #face{width:38px;height:38px;font-size:22px;line-height:1;padding:0;background:#c0c0c0;cursor:pointer;
    border:3px solid;border-color:#fff #808080 #808080 #fff}
  #face:active{border-color:#808080 #fff #fff #808080}
  #board{display:grid;border:3px solid;border-color:#808080 #fff #fff #808080}
  .cell{width:var(--c);height:var(--c);box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    font:bold calc(var(--c)*.64)/1 Arial,sans-serif;background:#c0c0c0;
    border:calc(var(--c)*.12) solid;border-color:#fff #808080 #808080 #fff}
  .cell.open{border:1px solid #808080;border-width:1px 0 0 1px}
  .cell.flag,.cell.mine{font-size:calc(var(--c)*.5)}
  .cell.boom{background:#f00}
  .n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}
  .n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}
</style>
</head>
<body>
  <div id="top">
    
    <button data-lv="easy">初級</button>
    <button data-lv="mid">中級</button>
    <button data-lv="hard">高級</button>
    <span id="best"></span>
  </div>
  <div id="win">
    <div id="bar">
      <div class="led" id="left">000</div>
      <button id="face">🙂</button>
      <div class="led" id="time">000</div>
    </div>
    <div id="board"></div>
  </div>

<script>
const LV = { easy: [9, 9, 10], mid: [16, 16, 40], hard: [30, 16, 99] };
const $ = id => document.getElementById(id);
const board = $('board'), face = $('face');

let key = localStorage.getItem('mine-lv');
if (!LV[key]) key = 'easy';
let C, Rn, M, cells, started, ended, flags, opened, secs, timer;

function led(n) {
  n = Math.max(-99, Math.min(999, n));
  return n < 0 ? '-' + String(-n).padStart(2, '0') : String(n).padStart(3, '0');
}

function fit() {
  const c = Math.max(16, Math.min(34, Math.floor((innerWidth - 50) / C), Math.floor((innerHeight - 170) / Rn)));
  document.body.style.setProperty('--c', c + 'px');
}

function showBest() {
  const b = localStorage.getItem('mine-best-' + key);
  $('best').textContent = b ? '最佳 ' + b + ' 秒' : '';
}

function init() {
  [C, Rn, M] = LV[key];
  clearInterval(timer);
  cells = [];
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${C},var(--c))`;
  for (let i = 0; i < C * Rn; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.i = i;
    board.appendChild(el);
    cells.push({ mine: false, open: false, flag: false, n: 0, el });
  }
  started = ended = false;
  flags = opened = secs = 0;
  face.textContent = '🙂';
  $('left').textContent = led(M);
  $('time').textContent = led(0);
  document.querySelectorAll('#top button').forEach(b => b.classList.toggle('on', b.dataset.lv === key));
  showBest();
  fit();
}

function nb(i) {
  const x = i % C, y = (i / C) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const nx = x + dx, ny = y + dy;
    if ((dx || dy) && nx >= 0 && nx < C && ny >= 0 && ny < Rn) out.push(ny * C + nx);
  }
  return out;
}

// 第一下一定安全：點到的格子和周圍八格都不放地雷
function place(safe) {
  const ban = new Set([safe, ...nb(safe)]);
  let left = M;
  while (left) {
    const i = (Math.random() * C * Rn) | 0;
    if (cells[i].mine || ban.has(i)) continue;
    cells[i].mine = true;
    left--;
  }
  cells.forEach((c, i) => { c.n = nb(i).filter(j => cells[j].mine).length; });
}

function open(i) {
  const c = cells[i];
  if (ended || c.open || c.flag) return;
  if (!started) {
    place(i);
    started = true;
    timer = setInterval(() => { $('time').textContent = led(++secs); }, 1000);
  }
  if (c.mine) return lose(i);
  const stack = [i];
  while (stack.length) {
    const j = stack.pop(), d = cells[j];
    if (d.open || d.flag) continue;
    d.open = true;
    opened++;
    d.el.classList.add('open');
    if (d.n) { d.el.textContent = d.n; d.el.classList.add('n' + d.n); }
    else stack.push(...nb(j));
  }
  if (opened === C * Rn - M) win();
}

// 點已翻開的數字：周圍旗子數量對了就一次翻開其餘格子
function chord(i) {
  const c = cells[i];
  if (ended || !c.open || !c.n) return;
  const around = nb(i);
  if (around.filter(j => cells[j].flag).length !== c.n) return;
  for (const j of around) if (!ended) open(j);
}

function toggleFlag(i) {
  const c = cells[i];
  if (ended || c.open) return;
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  c.el.textContent = c.flag ? '🚩' : '';
  c.el.classList.toggle('flag', c.flag);
  $('left').textContent = led(M - flags);
}

function lose(hit) {
  ended = true;
  clearInterval(timer);
  face.textContent = '😵';
  cells.forEach((c, i) => {
    if (c.mine && !c.flag) { c.el.textContent = '💣'; c.el.classList.add('open', 'mine'); }
    else if (c.flag && !c.mine) c.el.textContent = '❌';
    if (i === hit) c.el.classList.add('boom');
  });
}

function win() {
  ended = true;
  clearInterval(timer);
  face.textContent = '😎';
  cells.forEach(c => {
    if (c.mine && !c.flag) { c.flag = true; c.el.textContent = '🚩'; c.el.classList.add('flag'); }
  });
  $('left').textContent = led(0);
  const old = +localStorage.getItem('mine-best-' + key);
  if (!old || secs < old) localStorage.setItem('mine-best-' + key, secs);
  showBest();
}

const idx = e => { const el = e.target.closest('.cell'); return el ? +el.dataset.i : -1; };

board.addEventListener('mousedown', e => {
  const i = idx(e);
  if (i < 0 || ended) return;
  if (e.button === 0) face.textContent = '😮';
  else if (e.button === 2) toggleFlag(i);
  else if (e.button === 1) { e.preventDefault(); chord(i); }
});
document.addEventListener('mouseup', () => { if (!ended) face.textContent = '🙂'; });
board.addEventListener('click', e => {
  const i = idx(e);
  if (i < 0) return;
  cells[i].open ? chord(i) : open(i);
});
board.addEventListener('contextmenu', e => e.preventDefault());
// 手機：長按格子插旗（按住 0.4 秒），插旗後那一下不會翻開
let lpT=0, lpDone=false;
board.addEventListener('touchstart', e => { const i=idx(e); lpDone=false; if(i<0||ended) return; clearTimeout(lpT); lpT=setTimeout(()=>{ lpDone=true; toggleFlag(i); if(navigator.vibrate) navigator.vibrate(30); },400); }, {passive:true});
['touchend','touchmove','touchcancel'].forEach(n=>board.addEventListener(n, () => clearTimeout(lpT), {passive:true}));
board.addEventListener('click', e => { if(lpDone){ lpDone=false; e.stopImmediatePropagation(); } }, true);
board.style.webkitTouchCallout='none';
face.addEventListener('click', init);
document.querySelectorAll('#top button').forEach(b => b.addEventListener('click', () => {
  key = b.dataset.lv;
  localStorage.setItem('mine-lv', key);
  init();
}));
addEventListener('resize', fit);
addEventListener('keydown', e => { if (e.code === 'F2') init(); });

init();
</script>
</body>
</html>
