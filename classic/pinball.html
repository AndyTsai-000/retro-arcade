<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>彈珠台</title>

<style>
  html,body{margin:0;height:100%;background:#070a1c;color:#dfe6ff;font-family:"Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none}
  body{display:flex;flex-direction:column;align-items:center}
  #hud{display:flex;gap:18px;align-items:center;padding:8px 12px;font-size:14px;white-space:nowrap}
  #hud b{color:#ffd84a;font-size:20px;font-variant-numeric:tabular-nums;margin-left:4px}
  #hud a{color:#9fb4ff;text-decoration:none}
  #hud a:hover{text-decoration:underline}
  #mute{font-size:16px;background:none;border:1px solid #3a4a99;border-radius:6px;color:inherit;cursor:pointer;padding:2px 8px}
  canvas{display:block;border-radius:14px;box-shadow:0 0 30px #2a48ff55;touch-action:none}
  #tip{font-size:12px;opacity:.6;padding:5px}
</style>
</head>
<body>
  <div id="hud">
    
    <span>分數<b id="score">0</b></span>
    <span>球<b id="balls">3</b></span>
    <span>倍率<b id="mult">x1</b></span>
    <span>最高<b id="best">0</b></span>
    <button id="mute">🔊</button>
  </div>
  <canvas id="cv"></canvas>
  <div id="tip">← → 或 Z / 擋板　｜　按住空白鍵蓄力、放開發射</div>

<script>
const W = 420, H = 720, R = 9, GRAV = 950, SUB = 8, MAXV = 1800;
const REST = 0.48, UP = -0.55, FLEN = 64, FR = 6, FSPD = 16;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

// ---------- 球檯 ----------
const segs = [];
function seg(x1, y1, x2, y2, o) {
  const s = Object.assign({ x1, y1, x2, y2, r: 0, e: 0.45, t: 0 }, o);
  segs.push(s);
  return s;
}
seg(20, 170, 20, 560);            // 左牆
seg(20, 560, 114, 632);           // 左導板
seg(370, 170, 370, 720);          // 發射道隔板
seg(370, 560, 276, 632);          // 右導板
seg(400, 170, 400, 720);          // 右牆
seg(370, 672, 400, 672, { e: 0 }); // 彈簧頂
for (let i = 0, N = 30; i < N; i++) {  // 上方圓弧
  const a = Math.PI * (1 - i / N), b = Math.PI * (1 - (i + 1) / N);
  seg(210 + 190 * Math.cos(a), 170 - 150 * Math.sin(a), 210 + 190 * Math.cos(b), 170 - 150 * Math.sin(b), { e: 0.2 });
}
// 球離開發射道後才關上的單向門
seg(370, 170, 400, 148, { gate: true });
for (const x of [127, 172, 218, 263]) seg(x, 104, x, 136, { r: 3, post: true });

const slings = [];
function sling(ax, ay, bx, by, cx, cy) {
  seg(ax, ay, bx, by, { hide: true });
  seg(bx, by, cx, cy, { hide: true });
  slings.push({ p: [ax, ay, bx, by, cx, cy], face: seg(ax, ay, cx, cy, { kick: 420, hide: true }) });
}
sling(70, 450, 70, 530, 112, 560);
sling(320, 450, 320, 530, 278, 560);

const bumpers = [
  { x: 140, y: 250, r: 22, kick: 520, pts: 100, t: 0, col: '#ff4d6d' },
  { x: 250, y: 250, r: 22, kick: 520, pts: 100, t: 0, col: '#ffd84a' },
  { x: 195, y: 335, r: 22, kick: 520, pts: 100, t: 0, col: '#4dffb8' },
  { x: 70, y: 380, r: 11, kick: 200, pts: 50, t: 0, col: '#b78bff' },
  { x: 320, y: 380, r: 11, kick: 200, pts: 50, t: 0, col: '#b78bff' },
];
const lanes = [{ x: 149.5, on: false }, { x: 195, on: false }, { x: 240.5, on: false }];
const flips = [
  { x: 118, y: 640, s: 1, a: REST, w: 0, on: false },
  { x: 272, y: 640, s: -1, a: REST, w: 0, on: false },
];
const deco = [];
for (let i = 0; i < 60; i++) deco.push([30 + (i * 97) % 330, 60 + (i * 211) % 560, 0.5 + (i % 3) * 0.4]);

// ---------- 狀態 ----------
let ball = null, score = 0, balls = 3, mult = 1, over = false;
let charge = 0, charging = false, laneFlash = 0;
let best = +localStorage.getItem('pinball-best') || 0;
let mute = localStorage.getItem('pinball-mute') === '1';
let ac = null;

function beep(f, d = 0.06, type = 'square', v = 0.05) {
  if (mute) return;
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.value = f;
    g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + d);
  } catch (e) {}
}

function hud() {
  $('score').textContent = score.toLocaleString();
  $('balls').textContent = balls;
  $('mult').textContent = 'x' + mult;
  $('best').textContent = best.toLocaleString();
  $('mute').textContent = mute ? '🔇' : '🔊';
}
function add(p) { score += p * mult; hud(); }
function spawn() { ball = { x: 385, y: 672 - R, vx: 0, vy: 0, inLane: true }; }
function newGame() {
  score = 0; balls = 3; mult = 1; over = false; charge = 0; charging = false;
  lanes.forEach(l => l.on = false);
  spawn();
  hud();
}
function canLaunch() {
  return ball && ball.x > 370 && ball.y > 640 && Math.hypot(ball.vx, ball.vy) < 80;
}
function drain() {
  balls--;
  beep(110, 0.4, 'sawtooth');
  if (balls > 0) spawn();
  else {
    ball = null;
    over = true;
    if (score > best) { best = score; localStorage.setItem('pinball-best', best); }
  }
  hud();
}

// ---------- 物理 ----------
function hitSeg(b, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  let t = ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / (dx * dx + dy * dy);
  t = Math.max(0, Math.min(1, t));
  const px = s.x1 + t * dx, py = s.y1 + t * dy;
  let nx = b.x - px, ny = b.y - py;
  const d = Math.hypot(nx, ny), rad = R + s.r;
  if (d >= rad || d === 0) return;
  nx /= d; ny /= d;
  b.x = px + nx * rad; b.y = py + ny * rad;
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;
  const e = vn > -40 ? 0 : s.e;  // 很慢時不反彈，球才停得住
  b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
  if (s.kick && vn < -60 && t > 0.1 && t < 0.9) {
    b.vx += nx * s.kick; b.vy += ny * s.kick;
    s.t = 0.12;
    add(10);
    beep(330, 0.05);
  }
}

function hitBumper(b, m) {
  let nx = b.x - m.x, ny = b.y - m.y;
  const d = Math.hypot(nx, ny), rad = R + m.r;
  if (d >= rad || d === 0) return;
  nx /= d; ny /= d;
  b.x = m.x + nx * rad; b.y = m.y + ny * rad;
  let vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; vn = -vn; }
  if (vn < m.kick) { b.vx += (m.kick - vn) * nx; b.vy += (m.kick - vn) * ny; }
  if (m.t <= 0) { add(m.pts); beep(m.r > 15 ? 660 : 880, 0.07); }
  m.t = 0.15;
}

function hitFlip(b, f) {
  const dx = f.s * Math.cos(f.a) * FLEN, dy = Math.sin(f.a) * FLEN;
  let t = ((b.x - f.x) * dx + (b.y - f.y) * dy) / (FLEN * FLEN);
  t = Math.max(0, Math.min(1, t));
  const rx = t * dx, ry = t * dy;
  let nx = b.x - f.x - rx, ny = b.y - f.y - ry;
  const d = Math.hypot(nx, ny), rad = R + FR;
  if (d >= rad || d === 0) return;
  nx /= d; ny /= d;
  b.x = f.x + rx + nx * rad; b.y = f.y + ry + ny * rad;
  // 擋板揮動時，接觸點本身的速度會傳給球
  const sx = -f.w * ry, sy = f.w * rx;
  const vn = (b.vx - sx) * nx + (b.vy - sy) * ny;
  if (vn >= 0) return;
  const e = f.w ? 0.4 : (vn > -40 ? 0 : 0.3);
  b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
}

function step(dt) {
  for (const f of flips) {
    const tgt = f.on ? UP : REST, p = f.a;
    if (f.a < tgt) f.a = Math.min(tgt, f.a + FSPD * dt);
    else if (f.a > tgt) f.a = Math.max(tgt, f.a - FSPD * dt);
    f.w = f.s * (f.a - p) / dt;
  }
  if (charging && canLaunch()) charge = Math.min(1, charge + dt / 0.9);
  const b = ball;
  if (!b) return;
  b.vy += GRAV * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.inLane && b.x < 370 - R) b.inLane = false;
  for (const s of segs) if (!(s.gate && b.inLane)) hitSeg(b, s);
  for (const m of bumpers) hitBumper(b, m);
  for (const f of flips) hitFlip(b, f);
  const v = Math.hypot(b.vx, b.vy);
  if (v > MAXV) { b.vx *= MAXV / v; b.vy *= MAXV / v; }

  if (Math.abs(b.y - 120) < 12) for (const l of lanes) {
    if (l.on || Math.abs(b.x - l.x) > 16) continue;
    l.on = true;
    add(500);
    beep(990, 0.1, 'triangle');
    if (lanes.every(k => k.on)) {  // 三道全亮：加分、倍率 +1
      add(5000);
      mult = Math.min(5, mult + 1);
      lanes.forEach(k => k.on = false);
      laneFlash = 1;
      beep(1320, 0.3, 'triangle');
      hud();
    }
  }
  if (b.y > 695) drain();  // 已經掉到擋板下方，救不回來了
}

// ---------- 操作 ----------
function flip(i, down) {
  if (down && !flips[i].on) beep(180, 0.03);
  flips[i].on = down;
}
function plunger(down) {
  if (down) {
    if (over) return newGame();
    charging = true;
  } else {
    if (charging && charge > 0 && canLaunch()) {
      ball.vy = -(600 + charge * 1100);
      beep(220, 0.15, 'sawtooth');
    }
    charging = false; charge = 0;
  }
}
function key(code, down) {
  if (code === 'ArrowLeft' || code === 'KeyZ' || code === 'KeyA' || code === 'ShiftLeft') flip(0, down);
  else if (code === 'ArrowRight' || code === 'Slash' || code === 'KeyL' || code === 'ShiftRight') flip(1, down);
  else if (code === 'Space' || code === 'ArrowDown') plunger(down);
  else if (code === 'Enter') { if (down && over) newGame(); }
  else return false;
  return true;
}
addEventListener('keydown', e => { if (key(e.code, true)) e.preventDefault(); });
addEventListener('keyup', e => { if (key(e.code, false)) e.preventDefault(); });
addEventListener('blur', () => { flip(0, false); flip(1, false); charging = false; charge = 0; });

// 滑鼠／觸控：球在發射道時按住蓄力，其餘時候按左半邊、右半邊控制擋板
const ptr = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  let act;
  if (over || canLaunch()) { act = 'p'; plunger(true); }
  else { act = e.offsetX < cv.clientWidth / 2 ? 0 : 1; flip(act, true); }
  ptr.set(e.pointerId, act);
});
function ptrUp(e) {
  const act = ptr.get(e.pointerId);
  if (act === undefined) return;
  ptr.delete(e.pointerId);
  act === 'p' ? plunger(false) : flip(act, false);
}
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', ptrUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
$('mute').addEventListener('click', e => {
  mute = !mute;
  localStorage.setItem('pinball-mute', mute ? '1' : '0');
  e.target.blur();
  hud();
});

// ---------- 畫面 ----------
function glow(c, n) { ctx.shadowColor = c; ctx.shadowBlur = n; }
function text(s, y, size, col) {
  ctx.font = `bold ${size}px "Microsoft JhengHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = col;
  ctx.fillText(s, 195, y);
}

function draw() {
  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#161d55'); g.addColorStop(1, '#070a1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff55';
  for (const [x, y, r] of deco) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

  // 上方三道燈
  for (const l of lanes) {
    const lit = l.on || (laneFlash > 0 && Math.floor(laneFlash * 10) % 2 === 0);
    glow('#ffd84a', lit ? 14 : 0);
    ctx.fillStyle = lit ? '#ffd84a' : '#3a3f70';
    ctx.beginPath(); ctx.arc(l.x, 120, 7, 0, 7); ctx.fill();
  }

  // 牆
  ctx.lineCap = 'round';
  glow('#39b8ff', 8);
  ctx.strokeStyle = '#7fd8ff';
  for (const s of segs) {
    if (s.hide || s.gate) continue;
    ctx.lineWidth = s.post ? 6 : 4;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  if (ball && !ball.inLane) {
    ctx.strokeStyle = '#ff9d4d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(370, 170); ctx.lineTo(400, 148); ctx.stroke();
  }

  // 彈射三角
  for (const s of slings) {
    const hit = s.face.t > 0, p = s.p;
    glow('#ff4dd8', hit ? 20 : 8);
    ctx.fillStyle = hit ? '#ffc4f3' : '#7a2a8f';
    ctx.strokeStyle = '#ff7de6'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.lineTo(p[4], p[5]); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // 彈撞柱
  for (const m of bumpers) {
    const hit = m.t > 0, r = m.r + (hit ? 3 : 0);
    glow(m.col, hit ? 26 : 10);
    g = ctx.createRadialGradient(m.x - r * 0.3, m.y - r * 0.3, 1, m.x, m.y, r);
    g.addColorStop(0, '#fff'); g.addColorStop(hit ? 0.7 : 0.35, m.col); g.addColorStop(1, '#0008');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }

  // 彈簧
  glow('#000', 0);
  const py = 674 + charge * 28;
  ctx.fillStyle = '#c9ced9';
  ctx.fillRect(376, py, 18, 8);
  ctx.strokeStyle = '#8a90a3'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0, n = 6; i <= n; i++) ctx.lineTo(i % 2 ? 392 : 378, py + 8 + (H - py - 8) * i / n);
  ctx.stroke();
  if (charge > 0) { ctx.fillStyle = '#ff5a4d'; ctx.fillRect(404, 672 - charge * 120, 6, charge * 120); }

  // 擋板
  glow('#ff8a3d', 12);
  ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = FR * 2 + 2;
  for (const f of flips) {
    ctx.beginPath(); ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x + f.s * Math.cos(f.a) * FLEN, f.y + Math.sin(f.a) * FLEN);
    ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 7); ctx.fill();
  }

  // 球
  if (ball) {
    const by = ball.y + (canLaunch() ? charge * 28 : 0);
    glow('#fff', 10);
    g = ctx.createRadialGradient(ball.x - 3, by - 3, 1, ball.x, by, R);
    g.addColorStop(0, '#fff'); g.addColorStop(1, '#8a93a8');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, by, R, 0, 7); ctx.fill();
  }

  glow('#000', 6);
  if (over) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    text('遊戲結束', 320, 40, '#ff6b6b');
    text('分數 ' + score.toLocaleString(), 370, 22, '#fff');
    text('按空白鍵或點一下再玩一次', 410, 15, '#c9d3ff');
  } else if (canLaunch() && !charging) {
    text('按住空白鍵蓄力，放開發射', 600, 14, '#c9d3ff');
  }
  glow('#000', 0);
}

function fit() {
  const avail = innerHeight - $('hud').offsetHeight - $('tip').offsetHeight - 10;
  const h = Math.max(300, Math.min(avail, (innerWidth - 16) * H / W));
  const dpr = window.devicePixelRatio || 1;
  cv.style.height = h + 'px';
  cv.style.width = h * W / H + 'px';
  cv.width = Math.round(h * W / H * dpr);
  cv.height = Math.round(h * dpr);
}
addEventListener('resize', fit);

let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0);
  last = ts;
  if (dt > 0) for (let i = 0; i < SUB; i++) step(dt / SUB);
  for (const m of bumpers) m.t -= dt;
  for (const s of slings) s.face.t -= dt;
  laneFlash -= dt;
  draw();
  requestAnimationFrame(frame);
}

fit();
newGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
