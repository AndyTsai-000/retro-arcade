<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記憶翻牌</title>
<style>
  html,body{margin:0;height:100%;background:#0c0a1e;color:#e8e4ff;font-family:"Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none}
  body{display:flex;flex-direction:column;align-items:center}
  #hud{display:flex;gap:14px;align-items:center;padding:8px 12px;font-size:14px;white-space:nowrap;flex-wrap:wrap;justify-content:center}
  #hud b{color:#ffd84a;font-size:20px;font-variant-numeric:tabular-nums;margin-left:4px}
  #hud button{font:inherit;font-size:13px;padding:3px 10px;border-radius:8px;border:1px solid #6a5ab8;background:#241c50;color:#fff;cursor:pointer}
  #hud button.on{background:#ffd84a;color:#14122b;border-color:#ffd84a;font-weight:bold}
  canvas{display:block;border-radius:8px;touch-action:none}
  #tip{font-size:12px;opacity:.6;padding:5px}
</style>
</head>
<body>
  <div id="hud"><span id="sizes"></span><span>翻牌<b id="moves">0</b></span><span>配對<b id="pairs">0</b></span><span>最少<b id="best">-</b></span></div>
  <canvas id="cv"></canvas>
  <div id="tip">點兩張牌，一樣就配對成功，不一樣會蓋回去　｜　全部配完就過關，翻牌次數越少越好</div>
<script>
// 記憶翻牌：記住每張牌的位置，翻開兩張一樣的就留著。可選 12、16、24、36 張。
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const SIZES=[[4,3],[4,4],[6,4],[6,6]];
// 牌面圖案：自己用畫的（水果、動物、物品），每種配一個底色
const ICONS=['apple','orange','grape','melon','cherry','lemon','cat','fish','star','heart','moon','sun','flower','leaf','bell','cloud','drop','gem'];
const COL={apple:'#ff5d6d',orange:'#ff9d3d',grape:'#9a5ad8',melon:'#5fd068',cherry:'#e8304a',lemon:'#ffd23f',cat:'#f0a050',fish:'#4f9dff',star:'#ffc83a',heart:'#ff5d8f',moon:'#e8d88a',sun:'#ff8a1a',flower:'#ff7eb6',leaf:'#3aa850',bell:'#e8b830',cloud:'#8ac8ff',drop:'#3ddbd9',gem:'#b98cff'};
let size=+(localStorage.getItem('memory-size')||1),cols,rows,cards,open,moves,pairs,state,lockT=0,W=480,H=480,t=0,winT=0,sparks=[];
function bestKey(){ return 'memory-best-'+SIZES[size].join('x'); }
function hud(){ $('moves').textContent=moves; $('pairs').textContent=pairs+' / '+cards.length/2; const b=localStorage.getItem(bestKey()); $('best').textContent=b||'-'; }
function sizesUI(){ $('sizes').innerHTML=SIZES.map((s,i)=>'<button data-i="'+i+'" class="'+(i===size?'on':'')+'">'+s[0]*s[1]+' 張</button>').join(' '); $('sizes').querySelectorAll('button').forEach(b=>b.onclick=()=>{ size=+b.dataset.i; localStorage.setItem('memory-size',size); sizesUI(); reset(); fit(); }); }
function reset(){ [cols,rows]=SIZES[size]; const n=cols*rows/2,pick=ICONS.slice().sort(()=>Math.random()-.5).slice(0,n),deck=[...pick,...pick].sort(()=>Math.random()-.5);
  cards=deck.map((k,i)=>({k,i,flip:0,want:0,done:false,shake:0})); open=[]; moves=0; pairs=0; state='play'; winT=0; sparks=[]; hud(); }
function layout(){ const pad=10,cw=(W-pad*(cols+1))/cols,ch=(H-pad*(rows+1))/rows; return {pad,cw,ch}; }
function icon(k,x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s/40,s/40); ctx.lineJoin='round'; const c=COL[k]; ctx.fillStyle=c; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2;
  const circ=(x,y,r)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); };
  if(k==='apple'||k==='orange'||k==='lemon'||k==='melon'){ ctx.beginPath(); if(k==='lemon') ctx.ellipse(0,2,18,14,0,0,7); else ctx.arc(0,3,16,0,7); ctx.fill(); ctx.stroke(); if(k==='melon'){ ctx.strokeStyle='#2a8a3a'; ctx.lineWidth=2; for(const a of [-8,0,8]){ ctx.beginPath(); ctx.moveTo(a,-12); ctx.quadraticCurveTo(a*1.6,3,a,18); ctx.stroke(); } } ctx.fillStyle='#6a3a1a'; ctx.fillRect(-1.5,-18,3,8); ctx.fillStyle='#3aa850'; ctx.beginPath(); ctx.ellipse(7,-15,7,3.5,-.5,0,7); ctx.fill(); }
  else if(k==='cherry'){ ctx.strokeStyle='#3a7a2a'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-8,6); ctx.quadraticCurveTo(-4,-14,6,-18); ctx.moveTo(9,8); ctx.quadraticCurveTo(8,-8,6,-18); ctx.stroke(); circ(-8,9,9); circ(10,10,9); }
  else if(k==='grape'){ for(const [a,b] of [[-8,-6],[0,-6],[8,-6],[-4,2],[4,2],[0,10],[-12,2],[12,2],[-6,10],[6,10],[0,17]]) circ(a,b,5.5); ctx.fillStyle='#3a7a2a'; ctx.beginPath(); ctx.ellipse(4,-14,7,3,-.4,0,7); ctx.fill(); }
  else if(k==='cat'){ circ(0,4,15); ctx.beginPath(); ctx.moveTo(-14,-2); ctx.lineTo(-12,-18); ctx.lineTo(-3,-10); ctx.moveTo(14,-2); ctx.lineTo(12,-18); ctx.lineTo(3,-10); ctx.fill(); ctx.fillStyle='#2a1a10'; circ(-6,2,2.2); circ(6,2,2.2); ctx.strokeStyle='#2a1a10'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-3,9); ctx.quadraticCurveTo(0,12,3,9); ctx.stroke(); }
  else if(k==='fish'){ ctx.beginPath(); ctx.ellipse(-2,0,15,10,0,0,7); ctx.fill(); ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(20,-10); ctx.lineTo(20,10); ctx.closePath(); ctx.fill(); ctx.fillStyle='#fff'; circ(-9,-2,3); ctx.fillStyle='#14122b'; circ(-9,-2,1.5); }
  else if(k==='star'){ ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?7.5:18,a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r+2); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if(k==='heart'){ ctx.beginPath(); ctx.moveTo(0,16); ctx.bezierCurveTo(-24,0,-14,-20,0,-8); ctx.bezierCurveTo(14,-20,24,0,0,16); ctx.fill(); ctx.stroke(); }
  else if(k==='moon'){ ctx.save(); ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.clip(); ctx.beginPath(); ctx.rect(-20,-20,40,40); ctx.arc(8,-5,13,0,7,true); ctx.fill('evenodd'); ctx.restore(); }
  else if(k==='sun'){ circ(0,0,10); ctx.strokeStyle=c; ctx.lineWidth=3; for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(a)*14,Math.sin(a)*14); ctx.lineTo(Math.cos(a)*19,Math.sin(a)*19); ctx.stroke(); } }
  else if(k==='flower'){ for(let i=0;i<5;i++){ const a=i*Math.PI*2/5; circ(Math.cos(a)*9,Math.sin(a)*9,7.5); } ctx.fillStyle='#ffd23f'; circ(0,0,6); }
  else if(k==='leaf'){ ctx.beginPath(); ctx.moveTo(-14,14); ctx.quadraticCurveTo(-16,-14,16,-16); ctx.quadraticCurveTo(14,14,-14,14); ctx.fill(); ctx.strokeStyle='#1a6a2a'; ctx.beginPath(); ctx.moveTo(-14,14); ctx.lineTo(10,-10); ctx.stroke(); }
  else if(k==='bell'){ ctx.beginPath(); ctx.moveTo(-14,10); ctx.quadraticCurveTo(-14,-16,0,-16); ctx.quadraticCurveTo(14,-16,14,10); ctx.lineTo(17,13); ctx.lineTo(-17,13); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle='#a07010'; circ(0,16,3.5); }
  else if(k==='cloud'){ circ(-8,4,9); circ(3,-2,11); circ(12,6,8); ctx.fillRect(-8,4,20,9); }
  else if(k==='drop'){ ctx.beginPath(); ctx.moveTo(0,-18); ctx.quadraticCurveTo(15,4,0,16); ctx.quadraticCurveTo(-15,4,0,-18); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-4,4,2.5,5,.3,0,7); ctx.fill(); }
  else if(k==='gem'){ ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(-8,-14); ctx.lineTo(8,-14); ctx.lineTo(16,-6); ctx.lineTo(0,16); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(16,-6); ctx.moveTo(-6,-6); ctx.lineTo(0,16); ctx.lineTo(6,-6); ctx.stroke(); }
  if(['apple','orange','cherry','lemon','grape','heart','star'].includes(k)){ ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-6,-3,3,5,.5,0,7); ctx.fill(); }
  ctx.restore(); }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function draw(){ const k=cv.width/W; ctx.setTransform(k,0,0,k,0,0);
  let g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,W*.75); g.addColorStop(0,'#2a7a5a'); g.addColorStop(1,'#123a2a'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); // 綠色牌桌絨布
  ctx.fillStyle='rgba(255,255,255,.025)'; for(let i=0;i<300;i++) ctx.fillRect((i*97)%W,(i*61)%H,2,2);
  const {pad,cw,ch}=layout();
  for(const cd of cards){ const x=pad+(cd.i%cols)*(cw+pad),y=pad+Math.floor(cd.i/cols)*(ch+pad),f=cd.flip,sx=Math.abs(Math.cos(f*Math.PI)),face=f>.5,lift=Math.sin(f*Math.PI)*6,sh=cd.shake>0?Math.sin(cd.shake*40)*4:0;
    ctx.save(); ctx.translate(x+cw/2+sh,y+ch/2-lift); ctx.scale(Math.max(.02,sx),1);
    ctx.fillStyle='rgba(0,0,0,.3)'; rrect(-cw/2+3,-ch/2+5+lift,cw,ch,9); ctx.fill();
    if(face){ ctx.fillStyle=cd.done?'#fffbea':'#fff'; rrect(-cw/2,-ch/2,cw,ch,9); ctx.fill(); ctx.strokeStyle=cd.done?'#ffd84a':'#d8d4e8'; ctx.lineWidth=cd.done?3:1.5; ctx.stroke(); icon(cd.k,0,0,Math.min(cw,ch)*.62); if(cd.done){ ctx.fillStyle='rgba(255,216,74,'+(.25+.15*Math.sin(t*4+cd.i))+')'; rrect(-cw/2,-ch/2,cw,ch,9); ctx.fill(); } }
    else { const bg=ctx.createLinearGradient(0,-ch/2,0,ch/2); bg.addColorStop(0,'#4a3aa8'); bg.addColorStop(1,'#2a1f6a'); ctx.fillStyle=bg; rrect(-cw/2,-ch/2,cw,ch,9); ctx.fill(); ctx.strokeStyle='#ffd84a'; ctx.lineWidth=2; rrect(-cw/2+5,-ch/2+5,cw-10,ch-10,6); ctx.stroke();
      ctx.strokeStyle='rgba(255,216,74,.25)'; ctx.lineWidth=1; for(let d=-cw;d<cw+ch;d+=9){ ctx.beginPath(); ctx.moveTo(-cw/2+5+Math.max(0,d-ch+10),-ch/2+5+Math.min(d,ch-10)); ctx.lineTo(-cw/2+5+Math.min(d,cw-10),-ch/2+5+Math.max(0,d-cw+10)); ctx.stroke(); }
      ctx.fillStyle='#ffd84a'; ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?5:11,a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); ctx.fill(); }
    ctx.restore(); }
  for(const s of sparks){ ctx.globalAlpha=1-s.t; ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,3*(1-s.t)+1,0,7); ctx.fill(); } ctx.globalAlpha=1;
  if(state==='win'){ ctx.fillStyle='rgba(0,0,0,'+Math.min(.55,winT)+')'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.textBaseline='middle'; const T=(s,y,sz,c)=>{ ctx.font='bold '+sz+'px "Microsoft JhengHei"'; ctx.lineWidth=5; ctx.strokeStyle='#0c0a1e'; ctx.strokeText(s,W/2,y); ctx.fillStyle=c; ctx.fillText(s,W/2,y); };
    T('全部配對完成！',H/2-30,36,'#ffd84a'); T('翻了 '+moves+' 次',H/2+12,22,'#fff'); T('點一下再玩一次',H/2+48,16,'#cfc8ff'); } }
function tap(i){ if(state==='win'){ reset(); return; } const cd=cards[i]; if(!cd||cd.done||cd.want||lockT>0) return; cd.want=1; open.push(cd);
  if(open.length===2){ moves++; const [a,b]=open; if(a.k===b.k){ a.done=b.done=true; pairs++; open=[]; const {pad,cw,ch}=layout(); for(const q of [a,b]) for(let j=0;j<14;j++){ const an=Math.random()*7; sparks.push({x:pad+(q.i%cols)*(cw+pad)+cw/2,y:pad+Math.floor(q.i/cols)*(ch+pad)+ch/2,vx:Math.cos(an)*120,vy:Math.sin(an)*120,t:0,c:COL[q.k]}); }
      if(pairs===cards.length/2){ state='win'; const b0=+localStorage.getItem(bestKey())||0; if(!b0||moves<b0) localStorage.setItem(bestKey(),moves); } }
    else { lockT=1.0; } hud(); } }
function update(dt){ t+=dt; if(state==='win') winT+=dt; for(const cd of cards){ const target=cd.want||cd.done?1:0; cd.flip+=(target-cd.flip)*Math.min(1,dt*10); if(cd.shake>0) cd.shake-=dt; }
  for(const s of sparks){ s.t+=dt*1.4; s.x+=s.vx*dt; s.y+=s.vy*dt; } sparks=sparks.filter(s=>s.t<1);
  if(lockT>0){ lockT-=dt; if(lockT<=.35&&open.length===2){ for(const c of open) c.shake=.3; } if(lockT<=0){ for(const c of open) c.want=0; open=[]; } } }
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,{pad,cw,ch}=layout(),cx=Math.floor((x-pad/2)/(cw+pad)),cy=Math.floor((y-pad/2)/(ch+pad)); if(state==='win'){ reset(); return; } if(cx>=0&&cx<cols&&cy>=0&&cy<rows) tap(cy*cols+cx); });
addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='Enter')&&state==='win'){ e.preventDefault(); reset(); } });
function fit(){ const avH=innerHeight-$('hud').offsetHeight-$('tip').offsetHeight-14,avW=innerWidth-20,ratio=cols/rows*1.0; W=480; H=Math.round(480/ratio*(rows>=cols?1:1)); if(H<300) H=300; const s=Math.max(200,Math.min(avH,avW*H/W)),dpr=window.devicePixelRatio||1; cv.style.height=s+'px'; cv.style.width=s*W/H+'px'; cv.width=Math.round(s*W/H*dpr); cv.height=Math.round(s*dpr); }
addEventListener('resize',fit);
let last=0; function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; update(dt); draw(); requestAnimationFrame(frame); }
sizesUI(); reset(); fit(); requestAnimationFrame(frame);
</script>
</body>
</html>
