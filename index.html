<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14122b">
<meta property="og:title" content="跨界遊戲區">
<meta property="og:description" content="樓梯大逃亡、卡丁車、水球炸翻天、躲避球、足球、棒球、保齡球…打開就能玩，還能開房間連線。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://andytsai-000.github.io/retro-arcade/icon-512.png">
<meta name="description" content="十二款小遊戲，從動作、賽車、球類到益智都有，電腦手機都能玩，可開房間和朋友連線。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="跨界遊戲區">
<title>跨界遊戲區</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：大廳是三張「卡帶」並排；進遊戲後變成一個填滿畫面的機台（上方列、畫面、觸控按鈕）。 */
:root{
  color-scheme:dark;
  --ink:#14122b; --panel:#211e45; --panel2:#2b2759; --line:#403b7c;
  --text:#f4f0ff; --dim:#aaa4d8;
  --yellow:#ffd23f; --pink:#ff5d8f; --cyan:#3ddbd9; --green:#86dc4f;
  --pixel:"Press Start 2P","Noto Sans TC","Microsoft JhengHei",monospace;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
kbd{font-family:var(--pixel);font-size:10px;background:var(--ink);border:1px solid var(--line);border-bottom-width:3px;
  border-radius:4px;padding:4px 6px;white-space:nowrap}

/* ---------- 大廳 ---------- */
#hub{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:28px}
.mast{display:flex;flex-direction:column;gap:10px;position:relative}
.me{font-weight:900;color:#14122b;background:var(--yellow);border:2px solid #0b0a1c;border-radius:4px;padding:4px 10px;white-space:nowrap;max-width:11em;overflow:hidden;text-overflow:ellipsis}
.me:empty{display:none}
#hubName{position:absolute;right:0;top:0;box-shadow:3px 3px 0 #0b0a1c}
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,9,26,.9);display:flex;padding:16px;overflow:auto}
#pName{width:10em;text-align:center;background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:8px;font-weight:700;font-size:17px}
.warn{color:var(--pink)!important;font-weight:700;min-height:1.6em}
.lk{width:100%;max-width:360px;aspect-ratio:9/5;margin:0 auto;display:block;background:var(--ink);border:2px solid #0b0a1c;border-radius:4px}
.hint{font-size:13px}
.chips .olbl{align-self:center;color:var(--dim);font-size:13px;font-weight:700;margin-right:2px}
.ph{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#2b2759;border:2px solid var(--yellow);align-self:center}
.lk.demo{aspect-ratio:16/9;max-width:400px}
.lk.sp{aspect-ratio:24/11;max-width:none}
.spRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card:has(.spRow){max-width:660px}
.lk.sq{aspect-ratio:4/3;max-width:none;overflow:hidden}
.lkrow{display:grid;grid-template-columns:6em 1fr;gap:8px;align-items:center;text-align:left}
.lkrow>span{color:var(--dim);font-weight:700}
.lkrow .chips{justify-content:flex-start}
.lklist{display:flex;flex-direction:column}
/* 我的造型：左邊車子和人物、右邊選項 */
.card:has(.lkSplit){max-width:980px}
.lkSplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.lkL{position:sticky;top:0;display:flex;flex-direction:column;gap:8px}
.lkL .lk{max-width:none;aspect-ratio:auto;height:min(460px,calc(100vh - 330px));min-height:240px}.lkL canvas.lk{height:auto;min-height:0;aspect-ratio:9/5}
.lkSplit .lklist{max-height:max(280px,calc(100vh - 300px));overflow-y:auto;padding-right:8px;scrollbar-width:thin}
@media (max-width:720px){.lkSplit{grid-template-columns:minmax(0,1fr);gap:10px}.lkL{z-index:2;background:var(--panel);padding-bottom:6px}.lkL .lk{height:auto;min-height:0;aspect-ratio:16/9}.lkL .hint{display:none}.lkSplit .lklist{max-height:none;overflow:visible}}
.lklist>.lkrow,.lklist>.lkhead{border-top:1px solid var(--line);padding:8px 0}
.lklist>.lkrow:first-child{border-top:0}
.lklist>.hint{margin:-4px 0 8px}
.lkhead{text-align:left;color:var(--yellow);font-weight:700}.lkhead small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.lkhead~.lkf{border-top-style:dashed}.lkhead~.lkf>.lkt{padding-left:.6em}
.lkt{cursor:pointer;user-select:none}.lkt::before{content:'▼';display:inline-block;width:1.3em;font-size:.8em;color:var(--cyan)}
.lkrow.fold .lkt::before{content:'▶'}
.lkrow.fold .chips,.lkrow:not(.fold) .lksum{display:none}
.lksum{cursor:pointer;font-weight:700;min-height:30px;line-height:30px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #0b0a1c;padding:0}
.sw.sel{outline:3px solid var(--text);outline-offset:2px}
.coin{font-family:var(--pixel);font-size:11px;letter-spacing:.12em;color:var(--cyan)}
.coin b{color:var(--yellow);font-weight:400;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
h1{margin:0;font-weight:900;font-size:clamp(40px,9vw,76px);line-height:1.05;letter-spacing:.04em;color:var(--yellow);
  text-shadow:4px 4px 0 var(--pink),8px 8px 0 #0b0a1c;text-wrap:balance}
.mast p{margin:0;color:var(--dim);max-width:34em}
.cats{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--ink);padding-block:10px;margin-block:-10px}
.cart .tab span:first-child{font-family:var(--body);font-weight:900;font-size:12px;line-height:1}
.cats button{background:var(--panel2);border:2px solid #0b0a1c;border-radius:20px;padding:5px 14px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 #0b0a1c;white-space:nowrap}
.cats button span{color:var(--dim);font-weight:700;margin-left:4px;font-size:12px}
.cats button.on{background:var(--yellow);color:#14122b}.cats button.on span{color:#14122b}
@media (max-width:640px){.cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.cats::-webkit-scrollbar{display:none}}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.shelf{grid-template-columns:minmax(0,1fr)}}
.cart{--c:var(--yellow);background:var(--panel);border:3px solid #0b0a1c;border-radius:6px;box-shadow:6px 6px 0 #0b0a1c;
  display:flex;flex-direction:column;min-width:0;padding:0;text-align:left;transition:transform .12s}
.cart:hover{transform:translate(-2px,-2px)}
.cart:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #0b0a1c}
.cart .tab{background:var(--c);color:#14122b;font-family:var(--pixel);font-size:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px}
.cart canvas{display:block;width:100%;aspect-ratio:16/9;background:#000;border-block:3px solid #0b0a1c}
.cart .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cart h2{margin:0;font-size:22px;font-weight:900;letter-spacing:.03em}
.cart .desc{margin:0;color:var(--dim);font-size:14px;flex:1}
.cart .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cart .best{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.cart .best b{color:var(--text)}
.cart .go{background:var(--c);color:#14122b;font-weight:900;padding:6px 14px;border-radius:4px;border:2px solid #0b0a1c}
.note{color:var(--dim);font-size:13px;margin:0}

/* ---------- 遊戲畫面 ---------- */
#play{height:100%;display:flex;flex-direction:column;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@supports (height:100dvh){#play{height:100dvh}}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:3px solid #0b0a1c}
.bar h2{margin:0;font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--panel2);border:2px solid #0b0a1c;border-radius:4px;padding:6px 12px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.main{background:var(--yellow);color:#14122b;font-weight:900;font-size:17px;padding:10px 22px;box-shadow:4px 4px 0 #0b0a1c}
.btn.main:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0b0a1c}
#wrap{flex:1;min-height:0;position:relative;background:#07060f}
#stage{position:absolute;inset:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage canvas.fit{object-fit:contain}
#ov{position:absolute;inset:0;background:rgba(10,9,26,.82);display:flex;padding:16px;overflow:auto}
.card{background:var(--panel);border:3px solid #0b0a1c;box-shadow:6px 6px 0 #0b0a1c;border-radius:6px;padding:22px 24px;
  max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;margin:auto}
.card h3{margin:0;font-size:28px;font-weight:900;color:var(--yellow);text-shadow:3px 3px 0 #0b0a1c}
.card p{margin:0;color:var(--dim)}
.card .big{font-family:var(--pixel);font-size:20px;color:var(--text);line-height:1.5}
.card .code{font-family:var(--pixel);font-size:34px;color:var(--cyan);letter-spacing:.2em;user-select:all}
.help{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;align-items:center;font-size:14px;margin:0 auto}
.help span{color:var(--dim)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0;max-width:120px}
.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pod i{font-style:normal;font-family:var(--pixel);font-size:20px;color:#14122b;width:100%;display:flex;align-items:center;justify-content:center;border:3px solid #0b0a1c;border-bottom:0;border-radius:4px 4px 0 0}
.pod.p1 i{height:92px}.pod.p2 i{height:66px}.pod.p3 i{height:46px}
.pod.p1 b{color:var(--yellow);font-size:18px}
.ls{border-collapse:collapse;margin:0 auto;font-size:13px;font-variant-numeric:tabular-nums}.ls td,.ls th{border:1px solid var(--line);padding:2px 6px;text-align:center}.ls th{text-align:left;white-space:nowrap}
.rest{list-style:none;margin:0;padding:0;color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--ink);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700}
.chip.sel{background:var(--cyan);border-color:#0b0a1c;color:#14122b}
.chip.lock{opacity:.4;cursor:not-allowed}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;padding:4px 2px}
.sg{height:42px;border-radius:10px;background:var(--ink);border:2px solid var(--line);color:var(--text);font-weight:900;font-size:15px;cursor:pointer}
.sg.done{background:#24503a;border-color:#3f8a5f}
.sg.sel{background:var(--cyan);border-color:#0b0a1c;color:#14122b}
.sg.lock{opacity:.3;cursor:not-allowed}
.sgInfo{font-weight:700;margin:4px 0 0}
.sgSplit .lkL .lk{height:auto}
.sgSplit .lkL{position:static}
.sgSplit .lklist .chips{justify-content:flex-start;padding:6px 0}
.sgSplit .lklist .help{margin:6px 0}
.sgGoal{text-align:left;margin:6px 0 4px;color:var(--dim);font-size:14px;line-height:1.6}
.stars{color:var(--yellow);letter-spacing:.05em}.chip.sel .stars{color:#7a3d00}
.who{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;counter-reset:w}
.who li{counter-increment:w;background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:3px 10px;font-weight:700}
.who li::before{content:counter(w) '. ';color:var(--dim)}
.who li.me{border-color:var(--yellow);color:var(--yellow)}
#nName{width:9em;text-align:center;background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:6px 8px;font-weight:700}
#nCode{width:6.5em;text-align:center;font-family:var(--pixel);font-size:16px;background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:8px}
#pad{display:none;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-top:3px solid #0b0a1c;touch-action:none;user-select:none;-webkit-user-select:none}
body.touch #pad{display:flex}
body.padswap #pad{flex-direction:row-reverse} /* 方向鍵放右邊 */
.side{display:flex;gap:12px;align-items:center}
.tb{width:72px;height:72px;border-radius:50%;background:var(--panel2);border:3px solid #0b0a1c;box-shadow:0 4px 0 #0b0a1c;
  font-weight:900;font-size:17px;touch-action:none;padding:0}
.tb.on{background:var(--yellow);color:#14122b;transform:translateY(3px);box-shadow:0 1px 0 #0b0a1c}
.tb.act{background:var(--pink);color:#14122b}
.tb.big{width:100px;height:100px;font-size:28px}
.dpad{width:138px;height:138px;border-radius:50%;background:var(--panel2);border:3px solid #0b0a1c;box-shadow:0 4px 0 #0b0a1c;position:relative;touch-action:none}
.dpad i{position:absolute;width:0;height:0;border:11px solid transparent;opacity:.55}
.dpad i.u{left:50%;top:12px;margin-left:-11px;border-bottom-color:var(--text);border-top-width:0}
.dpad i.d{left:50%;bottom:12px;margin-left:-11px;border-top-color:var(--text);border-bottom-width:0}
.dpad i.l{top:50%;left:12px;margin-top:-11px;border-right-color:var(--text);border-left-width:0}
.dpad i.r{top:50%;right:12px;margin-top:-11px;border-left-color:var(--text);border-right-width:0}
.dpad[data-d="u"] i.u,.dpad[data-d="d"] i.d,.dpad[data-d="l"] i.l,.dpad[data-d="r"] i.r{opacity:1;filter:drop-shadow(0 0 6px var(--yellow))}
@media (max-width:440px){.bar h2{display:none}#barName{display:none}body .bar{gap:4px;padding-inline:6px;flex-wrap:wrap;justify-content:center}body .bar .btn{padding:4px 6px;font-size:12px}.tb{width:60px;height:60px;font-size:15px}.side{gap:8px}.dpad{width:128px;height:128px}.side.g4{display:grid;grid-template-columns:repeat(2,auto);gap:8px}.side.g4 .tb{width:56px;height:56px;font-size:14px}.tb.big{width:86px;height:86px;font-size:26px}#padL:has(.tb.big)~#padR .tb{width:52px;height:52px;font-size:13px}}
/* ---------- 手機版 ---------- */
@media (max-width:640px){
  #hub{padding-block:18px 28px;gap:18px}
  .cart h2{font-size:20px}.cart .info{padding:12px 14px 14px}
  .bar{gap:6px;padding:6px 8px}.bar .btn{padding:6px 9px;font-size:13px}.bar h2{font-size:15px}
  #barName{display:none}
  #hubName{position:static;align-self:flex-end;order:-1}
  .card{padding:16px 14px;gap:12px}.card h3{font-size:23px}
  .help{font-size:13px;gap:6px 10px}.chip{padding:5px 10px;font-size:13px}
  .btn.main{font-size:16px;padding:10px 18px}
  .lkrow{grid-template-columns:5.2em 1fr}
}
/* 手機橫放：畫面讓給遊戲，按鈕半透明疊在畫面兩側 */
@media (orientation:landscape) and (max-height:540px){
  body.touch #play{position:relative}
  body.touch .bar{padding:3px 8px;gap:6px}
  body.touch .bar .btn{padding:3px 9px;font-size:12px}
  body.touch .bar h2{font-size:13px}
  body.touch #pad{display:none}
  body.touch.playing #pad{display:flex;position:absolute;left:0;right:0;bottom:0;background:none;border:0;pointer-events:none;z-index:5;padding:6px max(12px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
  body.touch.playing #pad .tb,body.touch.playing #pad .dpad{pointer-events:auto;opacity:.66}
  body.touch.playing #pad .tb.on{opacity:.95}
  .card{padding:12px 14px;gap:8px}.card h3{font-size:20px}
}
.turn{display:none;color:var(--yellow)!important;font-weight:700}
@media (orientation:portrait){body.touch .turn{display:block}}
@media (prefers-reduced-motion:reduce){.coin b{animation:none}.cart{transition:none}}
</style>

<div id="hub">
  <header class="mast">
    <button class="me" id="hubName" type="button"></button>
    <div class="coin">RETRO ARCADE <b>&#9654; INSERT COIN</b></div>
    <h1>跨界遊戲區</h1>
    <p>放學後的網咖、電腦課偷玩的那幾款。選一張卡帶就能開始，電腦用鍵盤、手機用畫面上的按鈕。</p>
  </header>
  <nav class="cats" id="cats" aria-label="遊戲分類"></nav>
  <main class="shelf" id="shelf"></main>
  <p class="note">紀錄只存在這台裝置的瀏覽器裡。　版本 <span id="ver"></span></p>
</div>

<div id="play" hidden>
  <div class="bar">
    <button class="btn" id="bBack">&larr; <span class="lg">回到遊戲區</span>大廳</button>
    <h2 id="gName"></h2>
    <span class="me" id="barName"></span>
    <button class="btn" id="bSide" hidden>方向鍵：左</button>
    <button class="btn" id="bFull" hidden>全螢幕</button>

</div>

<div id="modal" hidden><div class="card" id="mcard"></div></div>

<script>
window.ARCADE_V=104; // 每次改版加一
(function(){ var q=/github\.io$/.test(location.hostname)?'?v='+window.ARCADE_V:'';
  document.write(['stairs','kart','bomb','volley','dodge','soccer','bowl','baseball','purple','rummy','mahjong','meow'].map(function(n){ return '<script src="'+n+'.js'+q+'"><\/script>'; }).join('')); })();
</script>
<script>
(function(){
'use strict';
// 在 LINE、Facebook、Instagram 等 App 的內建瀏覽器裡直接就能玩，不強制跳到外部瀏覽器
const G=window.ARCADE_GAMES||{};
const ORDER=['stairs','kart','bomb','volley','dodge','soccer','bowl','baseball','purple','rummy','mahjong','meow'].filter(k=>G[k]);
const $=s=>document.querySelector(s);
// 大廳分類（每款遊戲屬於一個類別）
const CATS=[['act','動作闖關'],['race','競速'],['ball','球類運動'],['fight','格鬥'],['board','益智桌遊']];
const CAT_OF={stairs:'act',bomb:'act',kart:'race',volley:'ball',dodge:'ball',soccer:'ball',bowl:'ball',baseball:'ball',purple:'fight',rummy:'board',mahjong:'board',meow:'board'};
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch) document.body.classList.add('touch');
const load=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};

let AC=null,master=null,muted=load('arcade.mute')==='1';
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,v,slide,delay){
  if(!AC) return; const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(v||.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
}
function noise(d,v,delay){
  if(!AC) return; const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(); s.buffer=buf; g.gain.value=v||.12; s.connect(g); g.connect(master); s.start(AC.currentTime+(delay||0));
}
const SFX={

  spring(){tone(260,.16,'square',.05,3);},
  hurt(){tone(180,.18,'sawtooth',.08,.5);noise(.12,.08);},
  die(){tone(420,.5,'square',.07,.15);},
  place(){tone(240,.1,'sine',.1,1.8);},
  boom(){noise(.35,.2);tone(90,.3,'sine',.15,.4);},
  item(){tone(660,.07,'square',.05);tone(990,.1,'square',.05,1,.07);},
  trap(){tone(500,.3,'sine',.08,.4);},
  pop(){noise(.1,.15);tone(800,.1,'square',.05,.3);},
  beep(){tone(440,.15,'square',.06);},
  go(){tone(880,.4,'square',.06);},
  boost(){noise(.5,.08);tone(200,.5,'sawtooth',.05,3);},

const keys={},hits={};
const BLOCK={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,Space:1};
function press(c){ if(!keys[c]) hits[c]=true; keys[c]=true; }

addEventListener('keydown',e=>{
  if(!cur||(e.target&&e.target.tagName==='INPUT')) return;
  if(BLOCK[e.code]) e.preventDefault();
  if(e.repeat) return;
  if(e.altKey&&(e.code==='Enter'||e.code==='NumpadEnter')){ e.preventDefault(); if(window.__toggleFull) window.__toggleFull(); return; }
  if(e.code==='Escape'||e.code==='KeyP'){ if(!modal.hidden&&helpPaused){ closeHelp(); return; } togglePause(); return; }
  if(e.code==='Enter'&&state==='over'&&!Net.peer&&performance.now()>ovAt+500){ start(lastOpts); return; }
  press(e.code);

  if(!document.hidden&&Net.peer&&Net.peer.disconnected&&!Net.peer.destroyed){ try{Net.peer.reconnect();}catch(e){} } });

function buildPad(spec){
  const L=$('#padL'),R=$('#padR'); L.innerHTML=''; R.innerHTML='';
  $('#pad').hidden=!spec; // 純點擊的遊戲（例如拉密）不用按鈕列
  if(!spec) return;
  const fill=(box,list)=>{
    if(list==='dpad'){ box.appendChild(makeDpad()); return; }
    (list||[]).forEach(b=>{
      const t=el('button','tb'+(b.act?' act':'')+(b.big?' big':''),b.l); t.type='button';
      const down=e=>{e.preventDefault();t.classList.add('on');press(b.c);try{t.setPointerCapture(e.pointerId);}catch(_){}} ;
      const up=e=>{e.preventDefault();t.classList.remove('on');release(b.c);};
      t.addEventListener('pointerdown',down); t.addEventListener('pointerup',up); t.addEventListener('pointercancel',up);
      t.addEventListener('contextmenu',e=>e.preventDefault());
      box.appendChild(t);
    });
  };
  fill(L,spec.left); fill(R,spec.right);
  [L,R].forEach(b=>b.classList.toggle('g4',b.children.length===4)); // 四顆鍵在直向手機排成兩排
}
function makeDpad(){
  const d=el('div','dpad','<i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i>');
  const MAP={u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight'}; let now=null;
  const set=k=>{ if(k===now) return; if(now) release(MAP[now]); now=k; if(k){press(MAP[k]);d.dataset.d=k;} else delete d.dataset.d; };
  const at=e=>{ const r=d.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
    if(Math.hypot(x,y)<10) return; set(Math.abs(x)>Math.abs(y)?(x<0?'l':'r'):(y<0?'u':'d')); };
  d.addEventListener('pointerdown',e=>{e.preventDefault();try{d.setPointerCapture(e.pointerId);}catch(_){ } at(e);});
  d.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') at(e); });
  const up=e=>{e.preventDefault();set(null);}; d.addEventListener('pointerup',up); d.addEventListener('pointercancel',up);
  return d;
}

    const ids=L.opts.map(x=>x.id||x); r[L.key]=ids.includes(o[L.key])?o[L.key]:ids[0]; }

// 自動找臉：先用瀏覽器內建的臉部偵測，沒有的話載入 face-api（只在上傳照片時才下載）
const FACEAPI='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14';
let faceApiReady=null,phNote='';
async function detectFace(img){
  const best=list=>list.sort((a,b)=>b.w*b.h-a.w*a.h)[0];
  try{ if(!faceApiReady) faceApiReady=(async()=>{ if(!window.faceapi) await loadScript(FACEAPI+'/dist/face-api.js'); await faceapi.nets.tinyFaceDetector.loadFromUri(FACEAPI+'/model'); await faceapi.nets.faceLandmark68TinyNet.loadFromUri(FACEAPI+'/model'); })();
    await faceApiReady;
    const r=await faceapi.detectAllFaces(img,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.4})).withFaceLandmarks(true);
    if(r.length) return best(r.map(d=>({x:d.detection.box.x,y:d.detection.box.y,w:d.detection.box.width,h:d.detection.box.height,pts:d.landmarks.positions.map(p=>({x:p.x,y:p.y}))}))); }catch(e){ faceApiReady=null; }
  try{ if('FaceDetector' in window){ const r=await new FaceDetector({fastMode:true,maxDetectedFaces:5}).detect(img); if(r.length) return best(r.map(f=>({x:f.boundingBox.x,y:f.boundingBox.y,w:f.boundingBox.width,h:f.boundingBox.height}))); } }catch(e){}
  return null;
}
// 剪下整顆頭：沿下巴和臉頰的輪廓，往上用橢圓包住額頭和頭髮，背景透明，外圍加白色描邊
function cutHead(img,f){
  let jaw,cx,brow,chin,hw;
  if(f.pts){ jaw=f.pts.slice(0,17); brow=Math.min(...f.pts.slice(17,27).map(p=>p.y)); chin=f.pts[8].y; cx=(jaw[0].x+jaw[16].x)/2; hw=(jaw[16].x-jaw[0].x)/2*1.12; }
  else { cx=f.x+f.w/2; hw=f.w*.6; brow=f.y+f.h*.18; chin=f.y+f.h*1.02; jaw=null; }
  const fh=chin-brow,top=brow-fh*.8,midY=brow+fh*.15,x0=cx-hw*1.2,y0=top-fh*.08,side=Math.max(hw*2.4,chin+fh*.12-y0),S=256,k=S/side;
  const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
  const ox=(S-hw*2.4*k)/2,P=(px,py)=>[(px-x0)*k+ox,(py-y0)*k];
  const path=()=>{ x.beginPath();
    if(jaw){ const ex=(p,i)=>{ const dx=p.x-cx,sc=i<3||i>13?1.12:1.06; return P(cx+dx*sc,p.y+(i>3&&i<13?fh*.03:0)); }; // 下巴輪廓稍微往外留一點
      let q=ex(jaw[0],0); x.moveTo(q[0],q[1]); for(let i=1;i<17;i++){ q=ex(jaw[i],i); x.lineTo(q[0],q[1]); } }
    else { const a=P(cx+hw,midY),b=P(cx,chin); x.moveTo(a[0],a[1]); x.quadraticCurveTo(a[0],b[1],b[0],b[1]); const d=P(cx-hw,midY); x.quadraticCurveTo(d[0],b[1],d[0],d[1]); x.lineTo(...P(cx+hw,midY)); }
    const cc=P(cx,midY); x.ellipse(cc[0],cc[1],hw*1.14*k,(midY-top)*k,0,0,Math.PI,true); x.closePath(); };
  x.save(); path(); x.clip(); x.drawImage(img,x0-ox/k,y0,S/k,S/k,0,0,S,S); x.restore();
  path(); x.lineJoin='round'; x.lineWidth=7; x.strokeStyle='#ffffff'; x.stroke();
  let url=c.toDataURL('image/webp',.86); if(!/^data:image\/webp/.test(url)) url=c.toDataURL('image/png');
  return url;
}
function photoToFace(file,cb){
  const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=async()=>{ const S=192,c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'),w=img.naturalWidth,h=img.naturalHeight;
    let sx,sy,sz; const f=await detectFace(img);
    if(f){ cb(cutHead(img,f),true); return; }
    if(f){ sz=Math.min(Math.max(f.w,f.h)*1.45,w,h); const cx=f.x+f.w/2,cy=f.y+f.h*.45; sx=Math.max(0,Math.min(w-sz,cx-sz/2)); sy=Math.max(0,Math.min(h-sz,cy-sz/2)); } // 以臉為中心，留一點額頭和下巴
    else { sz=Math.min(w,h)*(h>w?.92:1); sx=(w-sz)/2; sy=h>w?Math.max(0,(h-sz)*.28):(h-sz)/2; }
    x.drawImage(img,sx,sy,sz,sz,0,0,S,S); cb(c.toDataURL('image/jpeg',.85),!!f); };
    img.onerror=()=>cb(null); img.src=fr.result; }; fr.readAsDataURL(file);
}
function bindPhoto(g,look){

async function lookCard(){

// 擲硬幣動畫：正面＝names[0]、反面＝names[1]，約 3 秒後回傳

    const TC='"Noto Sans TC","Microsoft JhengHei",sans-serif';

    const frame=()=>{ if(!cv.isConnected){ res(); return; }
      const t=(performance.now()-t0)/1000; c.fillStyle='#14122b'; c.fillRect(0,0,W,H);

      c.font='700 14px '+TC; c.fillStyle='#fff'; c.fillText('正面：'+info.names[0]+'　　反面：'+info.names[1],W/2,62);
      // 硬幣：往上拋、一邊翻轉，落地時停在結果那一面

      c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(W/2,H*.56+46,r*(1-Math.sin(u*Math.PI)*.4),9,0,0,7); c.fill();
      c.save(); c.translate(W/2,y); c.scale(Math.max(.08,Math.abs(k)),1);
      const g=c.createRadialGradient(-10,-12,4,0,0,r); g.addColorStop(0,face?'#e8e8f0':'#fff3a8'); g.addColorStop(1,face?'#9aa0b0':'#e0a020'); c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,7); c.fill();
      c.strokeStyle=face?'#6a7080':'#a86a10'; c.lineWidth=4; c.stroke(); c.lineWidth=1.5; c.beginPath(); c.arc(0,0,r-8,0,7); c.stroke();
      c.fillStyle=face?'#4a5060':'#7a4a08'; c.font='900 34px '+TC; c.fillText(face?'反':'正',0,2); c.restore();
      if(t>=LAND){ if(tick<0){ tick=1; try{ SFX.win(); }catch(e){} }
        const a=Math.min(1,(t-LAND)*3); c.globalAlpha=a; c.font='900 30px '+TC; c.lineWidth=6; c.strokeStyle='#14122b'; const msg=(first?'反面':'正面')+'！'+info.names[first]+' '+info.verb;

function Mq(url,onReady,onMsg){
  const te=new TextEncoder(),td=new TextDecoder(); let ws,buf=new Uint8Array(0),ping=0,pid=1;
  const str=t=>{ const b=te.encode(t),o=new Uint8Array(b.length+2); o[0]=b.length>>8; o[1]=b.length&255; o.set(b,2); return o; };
  const join=parts=>{ let n=0; for(const a of parts) n+=a.length; const o=new Uint8Array(n); let k=0; for(const a of parts){ o.set(a,k); k+=a.length; } return o; };

  const api={up:false,sub(){},pub(){},close(){}};
  try{ ws=new WebSocket(url,'mqtt'); }catch(e){ return api; }
  ws.binaryType='arraybuffer';
  ws.onopen=()=>ws.send(pkt(0x10,join([str('MQTT'),[4,2,0,60],str('ra'+Math.random().toString(36).slice(2,12))])));
  ws.onmessage=e=>{ buf=join([buf,new Uint8Array(e.data)]);
    for(;;){ if(buf.length<2) return; let mul=1,len=0,i=1,d; do{ if(i>=buf.length) return; d=buf[i++]; len+=(d&127)*mul; mul*=128; }while(d&128);
      if(buf.length<i+len) return; const type=buf[0]>>4,body=buf.slice(i,i+len); buf=buf.slice(i+len);
      if(type===2){ api.up=true; ping=setInterval(()=>{ if(ws.readyState===1) ws.send(new Uint8Array([0xC0,0])); },30000); onReady(); }
      else if(type===3){ const tl=(body[0]<<8)|body[1]; let o=null; try{ o=JSON.parse(td.decode(body.subarray(2+tl))); }catch(_){ } if(o) onMsg(o); } } };
  ws.onclose=ws.onerror=()=>{ api.up=false; clearInterval(ping); };
  api.sub=t=>{ if(ws.readyState===1) ws.send(pkt(0x82,join([[0,(pid++%250)+1],str(t),[0]]))); };
  api.pub=(t,o)=>{ if(ws.readyState===1) ws.send(pkt(0x30,join([str(t),te.encode(JSON.stringify(o))]))); };
  api.close=()=>{ clearInterval(ping); try{ws.close();}catch(e){} };

}
// 轉送連線：介面做得和 PeerJS 的連線一樣（open、send、on、close）
function relayConn(sendFn){
  const h={},c={open:true,relay:true,gone:false,last:performance.now(),
    on(ev,fn){ (h[ev]=h[ev]||[]).push(fn); return c; }, emit(ev,a){ (h[ev]||[]).slice().forEach(f=>f(a)); },
    send(m){ if(c.open) sendFn({d:m}); }, close(){ if(!c.open) return; c.open=false; sendFn({bye:1}); c.emit('close'); }};
  return c;
}

  for(const n of list) count[n]=(count[n]||0)+1;

// 房主收下一條連線（直連或轉送都走這裡）
function adopt(c,sid){
  c.on('open',()=>{
    if(Net.sid!==sid) return;
    const live=Net.conns.filter(x=>!x.gone);
    if(Net.inGame||live.length>=maxP()-1){ try{c.send({t:'full'});}catch(e){} c.gone=true; setTimeout(()=>{try{c.close();}catch(e){}},600); return; }
    Net.conns.push(c); roster();
  });
  c.on('data',d=>{ if(!d||c.gone||Net.sid!==sid) return;
    if(d.t==='name'){ c.name=cleanName(d.name); c.look=d.look; if(!Net.inGame) roster(); }
    else if(d.t==='toroom'){ if(!Net.inGame) return; if(state==='over') hostToRoom(); else Net.wantRoom=true; }
    else if(d.g!==undefined&&Net.game&&Net.game.onmsg&&c.idx) Net.game.onmsg(d.g,c.idx); });
  const drop=()=>{ if(c.gone||Net.sid!==sid) return; c.gone=true;
    if(Net.inGame){ if(Net.game&&Net.game.onleave&&c.idx) Net.game.onleave(c.idx); } else roster(); };
  c.on('close',drop); c.on('error',drop);
}
async function hostRoom(tries){
  audio(); busy('建立房間中…');
  let hasPeer=true; try{ await needPeer(); }catch(e){ hasPeer=false; }
  leaveNet();
  const code=String(1000+Math.floor(Math.random()*9000)),sid={},base=TOPIC+cur.id+'/'+code;
  Net.sid=sid; Net.host=true; Net.bots=0; Net.code=code; Net.me=0; Net.count=1; Net.peer={destroy(){}};
  let shown=false; const ready=()=>{ if(Net.sid!==sid||shown) return; shown=true; clearTimeout(Net.timer); roomCard(); };
  Net.timer=setTimeout(()=>{ if(Net.sid===sid&&!shown){ leaveNet(); netCard(NO_NET); } },CAN_NET?12000:5000);
  // 直連
  let peer=null; if(hasPeer){ try{ peer=new Peer(PREFIX+cur.id+'-'+code,ICE); }catch(e){} }
  if(peer){ Net.peer=peer; peer.on('open',ready);
    peer.on('disconnected',()=>{ if(Net.sid===sid){ try{peer.reconnect();}catch(e){} } });
    peer.on('error',e=>{ if(Net.sid===sid&&e.type==='unavailable-id'&&tries<3&&!shown) hostRoom(tries+1); });

  const mq=Mq(MQ_URL,()=>{ if(Net.sid!==sid) return; mq.sub(base+'/h'); ready(); },o=>{
    if(Net.sid!==sid||!o.f) return; let c=byId[o.f];
    if(o.bye){ if(c){ delete byId[o.f]; c.open=false; c.emit('close'); } return; }
    if(!c){ if(!o.hello) return; const to=base+'/c/'+o.f; c=byId[o.f]=relayConn(m=>mq.pub(to,m)); adopt(c,sid); mq.pub(to,{ok:1}); c.emit('open'); return; }
    c.last=performance.now(); if(o.hello) mq.pub(base+'/c/'+o.f,{ok:1}); if(o.d!==undefined) c.emit('data',o.d);
  });

  Net.tick=setInterval(()=>{ if(Net.sid!==sid) return; const now=performance.now();
    for(const id in byId){ const c=byId[id]; if(!c.open){ delete byId[id]; continue; }
      if(now-c.last>10000){ delete byId[id]; c.open=false; c.emit('close'); } else mq.pub(base+'/c/'+id,{hb:1}); } },2500);
}
function roster(){

  Net.names=allNames();

async function joinRoom(code){

  leaveNet();
  const sid={},base=TOPIC+cur.id+'/'+code,cid=Math.random().toString(36).slice(2,10);
  Net.sid=sid; Net.host=false; Net.code=code; Net.peer={destroy(){}};
  const fail=msg=>{ if(Net.sid!==sid) return; leaveNet(); netCard(msg); };
  let direct=false,relayed=false,wired=false,rc=null,peer=null;
  const wire=c=>{ if(wired) return; wired=true; Net.hostConn=c;
    c.on('data',d=>{ if(Net.sid===sid) fromHost(d); });
    const lost=()=>{ if(Net.sid===sid&&Net.hostConn===c) fail(Net.joined?'與房主的連線中斷了。':'房間已滿，或遊戲正在進行中。'); };

      const c=peer.connect(PREFIX+cur.id+'-'+code,{reliable:true,serialization:'json'});

    if(Net.sid!==sid||!relayed||!rc) return; rc.last=performance.now();
    if(o.bye){ rc.open=false; rc.emit('close'); return; }

    relayed=true; if(peer){ try{peer.destroy();}catch(e){} Net.peer={destroy(){}}; }
    const m=card.querySelector('p'); if(m) m.textContent='兩邊網路無法直接連線，改用轉送連線中…';

if(!myName) nameModal();

const STEP=1/120;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(state==='hub'){ drawThumbs(ts/1000); return; }
  if(lookPrev&&state==='ready'){ try{ if(lookPrev.v) lookPrev.v.draw(); else if(lookPrev.ctx) lookPrev.g.preview(lookPrev.ctx,360,200,lookPrev.look,ts/1000); }catch(e){} }
  if(stagePrev&&state==='ready'){ try{ stagePrev.v.draw(); }catch(e){} }
  if(!inst) return;
  const live=()=>inst&&(state==='running'||(state==='over'&&inst.bg));
  if(live()){
    acc+=dt; let n=0;
    while(acc>=STEP&&n<8&&live()){ inst.update(STEP); acc-=STEP; n++; for(const k in hits) delete hits[k]; }
  }
  if(inst) inst.draw();
}
buildHub(); $('#ver').textContent=window.ARCADE_V||'';
requestAnimationFrame(frame);
window.__arcade={step(n){ for(let i=0;i<(n||1)&&inst&&state==='running';i++){ inst.update(STEP); for(const k in hits) delete hits[k]; } },open,start,back,get state(){return state;},get inst(){return inst;},keys,press,release,Net};
})();
</script>
