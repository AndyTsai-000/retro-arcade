<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>懷舊遊戲區</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 版面：大廳是三張「卡帶」並排；進遊戲後變成一個填滿畫面的機台（上方列、畫面、觸控按鈕）。 */
:root{
  color-scheme:dark;
  --ink:#14122b; --panel:#211e45; --panel2:#2b2759; --line:#403b7c;
  --text:#f4f0ff; --dim:#aaa4d8;
  --yellow:#ffd23f; --pink:#ff5d8f; --cyan:#3ddbd9; --green:#86dc4f;
  --pixel:"Press Start 2P","Noto Sans TC","Microsoft JhengHei",monospace;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
kbd{font-family:var(--pixel);font-size:10px;background:var(--ink);border:1px solid var(--line);border-bottom-width:3px;
  border-radius:4px;padding:4px 6px;white-space:nowrap}

/* ---------- 大廳 ---------- */
#hub{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:28px}
.mast{display:flex;flex-direction:column;gap:10px}
.coin{font-family:var(--pixel);font-size:11px;letter-spacing:.12em;color:var(--cyan)}
.coin b{color:var(--yellow);font-weight:400;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
h1{margin:0;font-weight:900;font-size:clamp(40px,9vw,76px);line-height:1.05;letter-spacing:.04em;color:var(--yellow);
  text-shadow:4px 4px 0 var(--pink),8px 8px 0 #0b0a1c;text-wrap:balance}
.mast p{margin:0;color:var(--dim);max-width:34em}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.shelf{grid-template-columns:minmax(0,1fr)}}
.cart{--c:var(--yellow);background:var(--panel);border:3px solid #0b0a1c;border-radius:6px;box-shadow:6px 6px 0 #0b0a1c;
  display:flex;flex-direction:column;min-width:0;padding:0;text-align:left;transition:transform .12s}
.cart:hover{transform:translate(-2px,-2px)}
.cart:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #0b0a1c}
.cart .tab{background:var(--c);color:#14122b;font-family:var(--pixel);font-size:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px}
.cart canvas{display:block;width:100%;aspect-ratio:16/9;background:#000;border-block:3px solid #0b0a1c}
.cart .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cart h2{margin:0;font-size:22px;font-weight:900;letter-spacing:.03em}
.cart .desc{margin:0;color:var(--dim);font-size:14px;flex:1}
.cart .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cart .best{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.cart .best b{color:var(--text)}
.cart .go{background:var(--c);color:#14122b;font-weight:900;padding:6px 14px;border-radius:4px;border:2px solid #0b0a1c}
.note{color:var(--dim);font-size:13px;margin:0}

/* ---------- 遊戲畫面 ---------- */
#play{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:3px solid #0b0a1c}
.bar h2{margin:0;font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--panel2);border:2px solid #0b0a1c;border-radius:4px;padding:6px 12px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.main{background:var(--yellow);color:#14122b;font-weight:900;font-size:17px;padding:10px 22px;box-shadow:4px 4px 0 #0b0a1c}
.btn.main:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0b0a1c}
#wrap{flex:1;min-height:0;position:relative;background:#07060f}
#stage{position:absolute;inset:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage canvas.fit{object-fit:contain}
#ov{position:absolute;inset:0;background:rgba(10,9,26,.82);display:flex;padding:16px;overflow:auto}
.card{background:var(--panel);border:3px solid #0b0a1c;box-shadow:6px 6px 0 #0b0a1c;border-radius:6px;padding:22px 24px;
  max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;margin:auto}
.card h3{margin:0;font-size:28px;font-weight:900;color:var(--yellow);text-shadow:3px 3px 0 #0b0a1c}
.card p{margin:0;color:var(--dim)}
.card .big{font-family:var(--pixel);font-size:20px;color:var(--text);line-height:1.5}
.card .code{font-family:var(--pixel);font-size:34px;color:var(--cyan);letter-spacing:.2em;user-select:all}
.help{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;align-items:center;font-size:14px;margin:0 auto}
.help span{color:var(--dim)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--ink);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700}
.chip.sel{background:var(--cyan);border-color:#0b0a1c;color:#14122b}
.stars{color:var(--yellow);letter-spacing:.05em}.chip.sel .stars{color:#7a3d00}
#nCode{width:6.5em;text-align:center;font-family:var(--pixel);font-size:16px;background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:8px}
#pad{display:none;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-top:3px solid #0b0a1c;touch-action:none;user-select:none;-webkit-user-select:none}
body.touch #pad{display:flex}
.side{display:flex;gap:12px;align-items:center}
.tb{width:72px;height:72px;border-radius:50%;background:var(--panel2);border:3px solid #0b0a1c;box-shadow:0 4px 0 #0b0a1c;
  font-weight:900;font-size:17px;touch-action:none;padding:0}
.tb.on{background:var(--yellow);color:#14122b;transform:translateY(3px);box-shadow:0 1px 0 #0b0a1c}
.tb.act{background:var(--pink);color:#14122b}
.dpad{width:138px;height:138px;border-radius:50%;background:var(--panel2);border:3px solid #0b0a1c;box-shadow:0 4px 0 #0b0a1c;position:relative;touch-action:none}
.dpad i{position:absolute;width:0;height:0;border:11px solid transparent;opacity:.55}
.dpad i.u{left:50%;top:12px;margin-left:-11px;border-bottom-color:var(--text);border-top-width:0}
.dpad i.d{left:50%;bottom:12px;margin-left:-11px;border-top-color:var(--text);border-bottom-width:0}
.dpad i.l{top:50%;left:12px;margin-top:-11px;border-right-color:var(--text);border-left-width:0}
.dpad i.r{top:50%;right:12px;margin-top:-11px;border-left-color:var(--text);border-right-width:0}
.dpad[data-d="u"] i.u,.dpad[data-d="d"] i.d,.dpad[data-d="l"] i.l,.dpad[data-d="r"] i.r{opacity:1;filter:drop-shadow(0 0 6px var(--yellow))}
@media (max-width:440px){.tb{width:60px;height:60px;font-size:15px}.side{gap:8px}.dpad{width:128px;height:128px}}
@media (prefers-reduced-motion:reduce){.coin b{animation:none}.cart{transition:none}}
</style>

<div id="hub">
  <header class="mast">
    <div class="coin">RETRO ARCADE <b>&#9654; INSERT COIN</b></div>
    <h1>懷舊遊戲區</h1>
    <p>放學後的網咖、電腦課偷玩的那幾款。選一張卡帶就能開始，電腦用鍵盤、手機用畫面上的按鈕。</p>
  </header>
  <main class="shelf" id="shelf"></main>
  <p class="note">紀錄只存在這台裝置的瀏覽器裡。</p>
</div>

<div id="play" hidden>
  <div class="bar">
    <button class="btn" id="bBack">&larr; 大廳</button>
    <h2 id="gName"></h2>
    <button class="btn" id="bPause">暫停</button>
    <button class="btn" id="bMute">聲音：開</button>
  </div>
  <div id="wrap">
    <div id="stage"></div>
    <div id="ov"><div class="card" id="card"></div></div>
  </div>
  <div id="pad"><div class="side" id="padL"></div><div class="side" id="padR"></div></div>
</div>

<script src="stairs.js"></script>
<script src="kart.js"></script>
<script src="bomb.js"></script>
<script src="volley.js"></script>
<script>
(function(){
'use strict';
// LINE 內建瀏覽器改用外部瀏覽器開啟
if(/Line\//i.test(navigator.userAgent) && location.protocol.indexOf('http')===0 && !/openExternalBrowser/.test(location.search)){
  location.replace(location.pathname+'?openExternalBrowser=1'+location.hash); return;
}
const G=window.ARCADE_GAMES||{};
const ORDER=['stairs','kart','bomb','volley'].filter(k=>G[k]);
const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch) document.body.classList.add('touch');
const load=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const save=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>{s.remove();rej(new Error('load'));}; document.head.appendChild(s); });
}

/* ---------- 聲音 ---------- */
let AC=null,master=null,muted=load('arcade.mute')==='1';
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,v,slide,delay){
  if(!AC) return; const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(v||.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
}
function noise(d,v,delay){
  if(!AC) return; const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(); s.buffer=buf; g.gain.value=v||.12; s.connect(g); g.connect(master); s.start(AC.currentTime+(delay||0));
}
const SFX={
  click(){tone(660,.05,'square',.04);},
  land(){tone(300,.06,'square',.05,.6);},
  heal(){tone(700,.05,'square',.04,1.4);},
  spring(){tone(260,.16,'square',.05,3);},
  hurt(){tone(180,.18,'sawtooth',.08,.5);noise(.12,.08);},
  die(){tone(420,.5,'square',.07,.15);},
  place(){tone(240,.1,'sine',.1,1.8);},
  boom(){noise(.35,.2);tone(90,.3,'sine',.15,.4);},
  item(){tone(660,.07,'square',.05);tone(990,.1,'square',.05,1,.07);},
  trap(){tone(500,.3,'sine',.08,.4);},
  pop(){noise(.1,.15);tone(800,.1,'square',.05,.3);},
  beep(){tone(440,.15,'square',.06);},
  go(){tone(880,.4,'square',.06);},
  boost(){noise(.5,.08);tone(200,.5,'sawtooth',.05,3);},
  bump(){noise(.1,.12);},
  lap(){tone(784,.1,'square',.05);tone(1047,.2,'square',.05,1,.1);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.06,1,i*.13));},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.08,1,i*.17));}
};

/* ---------- 大廳 ---------- */
const thumbs=[];
function bestText(g){
  const v=parseFloat(load('arcade.best.'+g.id)); if(!isFinite(v)) return '尚無紀錄';
  return g.best.label+' <b>'+g.best.fmt(v)+'</b>';
}
function buildHub(){
  const shelf=$('#shelf'); shelf.innerHTML=''; thumbs.length=0;
  ORDER.forEach((id,i)=>{
    const g=G[id]; g.id=id;
    const b=el('button','cart'); b.style.setProperty('--c',g.color);
    b.innerHTML='<div class="tab"><span>GAME 0'+(i+1)+'</span><span>'+g.tag+'</span></div><canvas width="480" height="270"></canvas>'+
      '<div class="info"><h2>'+g.name+'</h2><p class="desc">'+g.desc+'</p><div class="foot"><span class="best">'+bestText(g)+'</span><span class="go">開始</span></div></div>';
    b.addEventListener('click',()=>open(id));
    shelf.appendChild(b);
    thumbs.push({g,ctx:b.querySelector('canvas').getContext('2d')});
  });
}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function drawThumbs(t){ for(const th of thumbs){ try{th.g.thumb(th.ctx,480,270,still?1.3:t);}catch(e){} } }

/* ---------- 輸入 ---------- */
const keys={},hits={};
const BLOCK={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,Space:1};
function press(c){ if(!keys[c]) hits[c]=true; keys[c]=true; }
function release(c){ keys[c]=false; }
addEventListener('keydown',e=>{
  if(!cur||(e.target&&e.target.tagName==='INPUT')) return;
  if(BLOCK[e.code]) e.preventDefault();
  if(e.repeat) return;
  if(e.code==='Escape'||e.code==='KeyP'){ togglePause(); return; }
  if(e.code==='Enter'&&state==='over'&&!Net.peer&&performance.now()>ovAt+500){ start(lastOpts); return; }
  press(e.code);
});
addEventListener('keyup',e=>release(e.code));
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='running') togglePause(); });

function buildPad(spec){
  const L=$('#padL'),R=$('#padR'); L.innerHTML=''; R.innerHTML='';
  if(!spec) return;
  const fill=(box,list)=>{
    if(list==='dpad'){ box.appendChild(makeDpad()); return; }
    (list||[]).forEach(b=>{
      const t=el('button','tb'+(b.act?' act':''),b.l); t.type='button';
      const down=e=>{e.preventDefault();t.classList.add('on');press(b.c);try{t.setPointerCapture(e.pointerId);}catch(_){}} ;
      const up=e=>{e.preventDefault();t.classList.remove('on');release(b.c);};
      t.addEventListener('pointerdown',down); t.addEventListener('pointerup',up); t.addEventListener('pointercancel',up);
      t.addEventListener('contextmenu',e=>e.preventDefault());
      box.appendChild(t);
    });
  };
  fill(L,spec.left); fill(R,spec.right);
}
function makeDpad(){
  const d=el('div','dpad','<i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i>');
  const MAP={u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight'}; let now=null;
  const set=k=>{ if(k===now) return; if(now) release(MAP[now]); now=k; if(k){press(MAP[k]);d.dataset.d=k;} else delete d.dataset.d; };
  const at=e=>{ const r=d.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
    if(Math.hypot(x,y)<10) return; set(Math.abs(x)>Math.abs(y)?(x<0?'l':'r'):(y<0?'u':'d')); };
  d.addEventListener('pointerdown',e=>{e.preventDefault();try{d.setPointerCapture(e.pointerId);}catch(_){ } at(e);});
  d.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') at(e); });
  const up=e=>{e.preventDefault();set(null);}; d.addEventListener('pointerup',up); d.addEventListener('pointercancel',up);
  return d;
}

/* ---------- 遊戲流程 ---------- */
let cur=null,inst=null,state='hub',lastOpts=null,ovAt=0,acc=0,last=0,stageSel=0,variantSel=null;
const stage=$('#stage'),ov=$('#ov'),card=$('#card');
const env={
  stage,keys,touch:isTouch,
  hit:c=>!!hits[c],
  sfx:n=>{ if(SFX[n]) SFX[n](); },
  audio:()=>AC, out:()=>master,
  canvas2d(w,h){ const c=document.createElement('canvas'),S=2; c.width=w*S;c.height=h*S;c.className='fit';stage.appendChild(c);
    const ctx=c.getContext('2d'); ctx.scale(S,S); return {canvas:c,ctx}; },
  end(res){ finish(res); }
};
function showCard(html){ card.innerHTML=html; ov.hidden=false; ovAt=performance.now(); }
function on(id,fn){ const b=$('#'+id); if(b) b.addEventListener('click',fn); }
function helpHtml(g){
  const t=isTouch&&g.touchHelp, rows=t?g.touchHelp:g.help;
  return '<div class="help">'+rows.map(r=>'<div>'+(t?'<b>'+r[0]+'</b>':r[0].split(' ').map(k=>'<kbd>'+k+'</kbd>').join(' '))+'</div><span>'+r[1]+'</span>').join('')+'</div>';
}
function chipsHtml(g){
  let h='';
  if(g.stages) h+='<div class="chips">'+g.stages.map((s,i)=>'<button class="chip'+(i===stageSel?' sel':'')+'" data-s="'+i+'">'+(i+1)+'　'+s+(g.stars?'　<span class="stars">'+'★'.repeat(g.stars[i])+'</span>':'')+'</button>').join('')+'</div>';
  if(g.variants) h+='<div class="chips">'+g.variants.map(v=>'<button class="chip'+(v.id===variantSel?' sel':'')+'" data-v="'+v.id+'">'+v.label+'</button>').join('')+'</div>';
  return h;
}
function bindChips(after){
  const group=(attr,set)=>card.querySelectorAll('['+attr+']').forEach(b=>b.addEventListener('click',()=>{
    set(b); card.querySelectorAll('['+attr+']').forEach(x=>x.classList.toggle('sel',x===b)); if(after) after();
  }));
  group('data-s',b=>{stageSel=+b.dataset.s;}); group('data-v',b=>{variantSel=b.dataset.v;});
}
const variantName=g=>{ const v=g.variants&&g.variants.find(v=>v.id===variantSel); return v?v.label:''; };
function padSpec(g,mode){ return typeof g.touch==='function'?g.touch(mode):g.touch; }
function killInst(){ if(inst){ try{inst.destroy();}catch(e){} inst=null; } stage.innerHTML=''; }
function open(id){
  audio(); SFX.click();
  cur=G[id]; stageSel=0; variantSel=cur.variants?cur.variants[0].id:null;
  $('#hub').hidden=true; $('#play').hidden=false; $('#gName').textContent=cur.name;
  buildPad(padSpec(cur)); stage.innerHTML='';
  startCard(); scrollTo(0,0);
}
function startCard(){
  const g=cur; state='ready'; $('#bPause').textContent='暫停';
  showCard('<h3>'+g.name+'</h3><p>'+g.goal+'</p>'+helpHtml(g)+chipsHtml(g)+
    '<div class="row">'+(g.modes?g.modes.filter(m=>!(m.kb&&isTouch)).map(m=>'<button class="btn main" data-m="'+m.id+'">'+m.label+'</button>').join(''):'<button class="btn main" id="sGo">開始</button>')+
    (g.online?'<button class="btn" id="sNet">多人連線</button>':'')+'</div>');
  bindChips(); on('sGo',()=>start({stage:stageSel})); on('sNet',()=>{SFX.click();netCard();});
  card.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>start({stage:stageSel,mode:b.dataset.m})));
}
async function start(opts){
  if(state==='loading'||!cur) return;
  if(opts.variant===undefined) opts.variant=variantSel;
  audio(); SFX.click(); lastOpts=opts; killInst();
  if(cur.load){
    state='loading'; showCard('<h3>載入中</h3><p>第一次開啟需要下載 3D 元件，請稍候。</p>');
    try{ await cur.load(); }catch(e){
      state='ready';
      showCard('<h3>載入失敗</h3><p>這款遊戲需要網路連線才能載入 3D 元件。請確認網路後再試一次。</p><div class="row"><button class="btn main" id="rTry">再試一次</button></div>');
      on('rTry',()=>start(opts)); return;
    }
    if(!cur) return;
  }
  for(const k in hits) delete hits[k];
  buildPad(padSpec(cur,opts.mode));
  inst=cur.create(env,{stage:opts.stage||0,mode:opts.mode,variant:opts.variant,net:opts.net?mkNet():null}); state='running'; acc=0; ov.hidden=true; $('#bPause').textContent='暫停';
}
function finish(res){
  if(state!=='running') return; state='over';
  const g=cur,key='arcade.best.'+g.id,old=parseFloat(load(key));
  let rec=false;
  if(res.score!=null&&isFinite(res.score)&&res.score>0){
    rec=!isFinite(old)||(g.best.lower?res.score<old:res.score>old);
    if(rec) save(key,String(res.score));
  }
  let btn;
  if(Net.peer) btn=Net.host?'<button class="btn main" id="rRoom">回房間</button>':'<p>等房主回到房間，就能再玩一場。</p>';
  else btn=(res.next?'<button class="btn main" id="rNext">下一關</button><button class="btn" id="rAgain">再玩一次</button>':'<button class="btn main" id="rAgain">再玩一次</button>');
  showCard('<h3>'+res.title+'</h3>'+(res.big?'<div class="big">'+res.big+'</div>':'')+(res.text?'<p>'+res.text+'</p>':'')+
    (Net.peer?'':'<p>'+(rec?'<b style="color:var(--green)">新紀錄！</b> ':'')+bestText(g)+'</p>')+
    '<div class="row">'+btn+'<button class="btn" id="rHub">'+(Net.peer?'離開':'回大廳')+'</button></div>');
  on('rAgain',()=>start(lastOpts)); on('rNext',()=>{stageSel=lastOpts.stage+1;start({stage:stageSel,mode:lastOpts.mode,variant:lastOpts.variant});});
  on('rRoom',hostToRoom); on('rHub',back);
}
function togglePause(){
  if(Net.peer) return;
  if(state==='running'){ state='paused'; if(inst.pause) inst.pause(true);
    showCard('<h3>暫停</h3><div class="row"><button class="btn main" id="rGo">繼續</button><button class="btn" id="rHub">回大廳</button></div>');
    on('rGo',togglePause); on('rHub',back); $('#bPause').textContent='繼續'; }
  else if(state==='paused'){ state='running'; if(inst.pause) inst.pause(false); ov.hidden=true; acc=0; $('#bPause').textContent='暫停'; }
}
function back(){
  leaveNet(); killInst(); cur=null; state='hub';
  for(const k in keys) keys[k]=false;
  $('#play').hidden=true; $('#hub').hidden=false; buildHub();
}
$('#bBack').addEventListener('click',back);
$('#bPause').addEventListener('click',togglePause);
function muteLabel(){ $('#bMute').textContent='聲音：'+(muted?'關':'開'); }
$('#bMute').addEventListener('click',()=>{ muted=!muted; save('arcade.mute',muted?'1':'0'); audio(); if(master) master.gain.value=muted?0:1; muteLabel(); });
muteLabel();

/* ---------- 多人連線（PeerJS，房主當中繼） ---------- */
const PEERJS='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',PREFIX='retro-arcade-tw-',maxP=()=>(cur&&cur.maxPlayers)||4;
// 連線只在獨立網址或本機能用；Claude 的頁面會擋掉對外連線
const CAN_NET=location.protocol==='file:'||/^(localhost|127\.0\.0\.1)$|github\.io$/.test(location.hostname);
const NO_NET=CAN_NET?'連不上連線伺服器，請確認網路後再試一次。':'這個頁面是 Claude 的預覽頁，對外連線被擋住，所以不能開房間。請改用獨立網址（或直接開啟電腦裡的 index.html）。';
const Net={peer:null,host:false,conns:[],hostConn:null,code:'',me:0,count:1,inGame:false,game:null,joined:false,timer:0};
function leaveNet(){
  clearTimeout(Net.timer);
  const p=Net.peer; Net.peer=null; Net.conns=[]; Net.hostConn=null; Net.inGame=false; Net.game=null; Net.joined=false; Net.host=false;
  if(p){ try{p.destroy();}catch(e){} }
}
function netCard(msg){
  state='ready'; killInst();
  showCard('<h3>多人連線</h3><p>一個人建立房間，把房號告訴朋友；其他人在自己的電腦或手機打開同一個網址，輸入房號加入。這款最多 '+maxP()+' 人。</p>'+
    '<div class="row"><button class="btn main" id="nHost">建立房間</button></div>'+
    '<div class="row"><input id="nCode" inputmode="numeric" maxlength="4" placeholder="房號" autocomplete="off"><button class="btn" id="nJoin">加入房間</button></div>'+
    '<p id="nMsg">'+(msg||(CAN_NET?'':NO_NET))+'</p><div class="row"><button class="btn" id="nBack">返回</button></div>');
  on('nHost',()=>hostRoom(0)); on('nJoin',()=>{ const c=$('#nCode').value.trim(); if(/^\d{4}$/.test(c)) joinRoom(c); else $('#nMsg').textContent='請輸入 4 位數房號。'; });
  on('nBack',()=>{leaveNet();startCard();});
}
function busy(t){ showCard('<h3>多人連線</h3><p>'+t+'</p><div class="row"><button class="btn" id="nBack">取消</button></div>'); on('nBack',()=>{leaveNet();netCard();}); }
async function needPeer(){ if(!window.Peer) await loadScript(PEERJS); }
async function hostRoom(tries){
  audio(); busy('建立房間中…');
  try{ await needPeer(); }catch(e){ return netCard(NO_NET); }
  leaveNet();
  const code=String(1000+Math.floor(Math.random()*9000)); let peer;
  try{ peer=new Peer(PREFIX+cur.id+'-'+code); }catch(e){ return netCard(NO_NET); }
  Net.peer=peer; Net.host=true; Net.code=code; Net.me=0; Net.count=1;
  Net.timer=setTimeout(()=>{ if(Net.peer===peer&&!peer.open){ leaveNet(); netCard(NO_NET); } },CAN_NET?12000:5000);
  peer.on('open',()=>{ if(Net.peer!==peer) return; clearTimeout(Net.timer); roomCard(); });
  peer.on('disconnected',()=>{ if(Net.peer===peer){ try{peer.reconnect();}catch(e){} } });
  peer.on('error',e=>{
    if(Net.peer!==peer) return;
    if(e.type==='unavailable-id'&&tries<3){ hostRoom(tries+1); return; }
    if(!peer.open&&!Net.inGame){ leaveNet(); netCard(NO_NET); }
  });
  peer.on('connection',c=>{
    c.on('open',()=>{
      if(Net.peer!==peer) return;
      const live=Net.conns.filter(x=>!x.gone);
      if(Net.inGame||live.length>=maxP()-1){ try{c.send({t:'full'});}catch(e){} setTimeout(()=>{try{c.close();}catch(e){}},600); c.gone=true; return; }
      Net.conns.push(c); roster();
    });
    c.on('data',d=>{ if(d&&d.g!==undefined&&Net.game&&Net.game.onmsg&&c.idx&&!c.gone) Net.game.onmsg(d.g,c.idx); });
    const drop=()=>{ if(c.gone||Net.peer!==peer) return; c.gone=true;
      if(Net.inGame){ if(Net.game&&Net.game.onleave&&c.idx) Net.game.onleave(c.idx); } else roster(); };
    c.on('close',drop); c.on('error',drop);
  });
}
function roster(){
  Net.conns=Net.conns.filter(c=>!c.gone); Net.count=Net.conns.length+1;
  Net.conns.forEach((c,i)=>{ c.idx=i+1; try{c.send({t:'roster',n:Net.count,me:i+1,code:Net.code,stage:stageSel,variant:variantSel});}catch(e){} });
  if(!Net.inGame) roomCard();
}
function joinRoom(code){
  audio(); busy('加入房間中…');
  needPeer().then(()=>{
    leaveNet();
    let peer; try{ peer=new Peer(); }catch(e){ return netCard(NO_NET); }
    Net.peer=peer; Net.host=false; Net.code=code;
    Net.timer=setTimeout(()=>{ if(Net.peer===peer&&!Net.joined){ leaveNet(); netCard(NO_NET); } },CAN_NET?15000:5000);
    peer.on('open',()=>{
      if(Net.peer!==peer) return;
      const c=peer.connect(PREFIX+cur.id+'-'+code,{reliable:true,serialization:'json'}); Net.hostConn=c;
      c.on('data',d=>{ if(Net.peer===peer) fromHost(d); });
      const lost=()=>{ if(Net.peer!==peer) return; const was=Net.joined; leaveNet(); netCard(was?'與房主的連線中斷了。':'房間已滿，或遊戲正在進行中。'); };
      c.on('close',lost); c.on('error',lost);
    });
    peer.on('error',e=>{
      if(Net.peer!==peer) return;
      if(e.type==='peer-unavailable'){ leaveNet(); netCard('找不到這個房間，請確認房號。'); }
      else if(!Net.joined){ leaveNet(); netCard(NO_NET); }
    });
  }).catch(()=>netCard(NO_NET));
}
function fromHost(d){
  if(!d) return;
  if(d.t==='roster'){ Net.joined=true; clearTimeout(Net.timer); Net.me=d.me; Net.count=d.n; stageSel=d.stage; variantSel=d.variant; if(!Net.inGame) roomCard(); }
  else if(d.t==='full'){ leaveNet(); netCard('房間已滿，或遊戲正在進行中。'); }
  else if(d.t==='start'){ Net.inGame=true; Net.me=d.me; Net.count=d.n; Net.seed=d.seed; stageSel=d.stage; variantSel=d.variant; state='ready'; start({stage:d.stage,net:true}); }
  else if(d.t==='room'){ Net.inGame=false; Net.game=null; killInst(); roomCard(); }
  else if(d.g!==undefined&&Net.game&&Net.game.onmsg) Net.game.onmsg(d.g,0);
}
function roomCard(){
  state='ready'; const g=cur;
  showCard('<h3>房間</h3><div class="code">'+Net.code+'</div><p>目前 '+Net.count+' 人，你是玩家 '+(Net.me+1)+'。'+(Net.host?'把房號告訴朋友。':'')+'</p>'+
    (Net.host?chipsHtml(g)+'<div class="row"><button class="btn main" id="nStart">開始遊戲</button></div>'
      :(g.stages?'<p>關卡：第 '+(stageSel+1)+' 關　'+g.stages[stageSel]+(variantName(g)?'　'+variantName(g):'')+'</p>':'')+'<p>等房主按開始…</p>')+
    '<div class="row"><button class="btn" id="nLeave">離開房間</button></div>');
  bindChips(()=>roster());
  on('nStart',()=>{
    Net.conns=Net.conns.filter(c=>!c.gone); Net.count=Net.conns.length+1; Net.inGame=true; Net.seed=(Math.random()*2147483647)|0;
    Net.conns.forEach((c,i)=>{ c.idx=i+1; try{c.send({t:'start',stage:stageSel,variant:variantSel,me:i+1,n:Net.count,seed:Net.seed});}catch(e){} });
    start({stage:stageSel,net:true});
  });
  on('nLeave',()=>{leaveNet();netCard();});
}
function hostToRoom(){
  Net.inGame=false; Net.game=null; killInst();
  for(const c of Net.conns) if(!c.gone){ try{c.send({t:'room'});}catch(e){} }
  roster();
}
function mkNet(){
  const host=Net.host;
  Net.game={host,me:Net.me,count:Net.count,seed:Net.seed,onmsg:null,onleave:null,
    send(p){ const m={g:p};
      if(host){ for(const c of Net.conns) if(!c.gone&&c.open){ try{c.send(m);}catch(e){} } }
      else if(Net.hostConn&&Net.hostConn.open){ try{Net.hostConn.send(m);}catch(e){} } }};
  return Net.game;
}

const STEP=1/120;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(state==='hub'){ drawThumbs(ts/1000); return; }
  if(!inst) return;
  const live=()=>inst&&(state==='running'||(state==='over'&&inst.bg));
  if(live()){
    acc+=dt; let n=0;
    while(acc>=STEP&&n<8&&live()){ inst.update(STEP); acc-=STEP; n++; for(const k in hits) delete hits[k]; }
  }
  if(inst) inst.draw();
}
buildHub();
requestAnimationFrame(frame);
window.__arcade={open,start,back,get state(){return state;},get inst(){return inst;},keys,press,release,Net};
})();
</script>
